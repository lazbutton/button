name: station

# The station command, deploy/station, in two jobs.
#
# bats: its tests, on a machine played by fake tools (deploy/tests/fakes/),
# without containers or network. In the official bats image, at a pinned
# version, with its bats-support and bats-assert. scripts/verifier.sh (deploy)
# runs the same image, read from here: the image alone on its line. Dependabot
# does not follow the image: bump it by hand. ShellCheck checks the script and
# its tests (shellcheck.yml).
#
# install: a real install, of what the fakes cannot see, in two cases.
# neuf: the runner, like a fresh VPS, has no Docker: station install puts the
# current one, from Docker's repository. deja-la: the runner keeps its Docker,
# with a Compose v2, like a VPS that had one before: station install installs
# nothing.
# The folder of the station is packed from this checkout, as for a version
# (scripts/version.py station main); the images are the :main ones of the
# registry, not built here: a pull request that changes an image and the
# folder together is only checked whole once merged. Then the smoke check,
# and a second install, which must change no file of the folder and no
# container. Then the commands of a station: status, a backup with the
# sounds, uninstall --purge, a fresh install as on a new machine, and
# restore, which must bring back the same accounts, clocks, weekly shows,
# Agenda, settings and sounds. The backup off the machine too (SAV-01), to a
# storage local to the runner, with no real account: rclone's S3 server in
# neuf, its SFTP server in deja-la, in the rclone image the station already
# pins. station config sets it, systemd runs the night's backup and the
# month's restore test, by their timers' services; then the machine is
# destroyed again, a fresh install takes the same repository, and restore
# --remote must bring back the same station. In both cases, the runner keeps
# the default ACL of /opt, open to every account: station install must keep it
# off .env and off the folder. Each case pulls the images three times, about 3
# GB each time: hence the paths below, what a real install runs, and not every
# pull request.
#
# update: a real update, of a station installed by the highest published
# version, with its own station command, to the folder of this checkout and
# the :main images (scripts/version.py station main), by the station command
# of this checkout. First, two broken versions of this checkout, which must
# come back by themselves to the published one (MAJ-05). In the first, the
# engine brings one more migration, which passes, then the console image
# exits at once (a busybox, built here, that the update does not pull). In
# the second, the engine brings two more migrations, the second of which
# fails, halfway. Each must leave the same images on every service, the same
# data, the database of before with its schema and tables, and the antenna
# back; HOLD set, updates.log and the system journal saying so, and the logs
# of the broken version kept. They go without ICECAST_MOUNT, as a station
# that takes the new address of its stream: back on the published version,
# the station is checked on the mount it serves. Then the true update, after
# the action that 1.0.0 asks: ICECAST_MOUNT keeps the stream on the mount it
# was served on. During, the stream is read every second, and the antenna
# must not be cut 30 s or more (MAJ-04). After, the same accounts, clocks,
# weekly shows, Agenda and settings, the backup of before, the line of
# updates.log and versions.json, then status and the smoke check. Last, the
# requests of the console (MAJ-07), written in the engine as the button writes
# them, taken by the timer of the host, button-demandes, which writes their
# result in the engine: the first broken version, which must come back by
# itself, rolled_back; then a request refused by the HOLD it left; then,
# HOLD lifted, the folder of this checkout again, done. The engine of :main
# has the command of the requests once this branch is merged: before, only
# the timer and its service are checked.

on:
  push:
    branches: [main]
    paths:
      - "deploy/station"
      - "deploy/tests/**"
      - "deploy/compose.yml"
      - "deploy/Caddyfile"
      - "deploy/scripts/**"
      - "scripts/version.py"
      - ".github/workflows/station.yml"
  pull_request:
    paths:
      - "deploy/station"
      - "deploy/tests/**"
      - "deploy/compose.yml"
      - "deploy/Caddyfile"
      - "deploy/scripts/**"
      - "scripts/version.py"
      - ".github/workflows/station.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bats:
    name: bats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The tests of deploy/station
        run: >
          docker run --rm -v "$PWD:/code:ro" -w /code
          docker.io/bats/bats:1.13.0
          deploy/tests

  install:
    name: real install
    # Not ubuntu-latest: station install takes Ubuntu 24.04, not the next one.
    runs-on: ubuntu-24.04
    # Above the sum of the steps' own limits: a step that hangs fails on its
    # own, and its logs are still uploaded.
    timeout-minutes: 90
    strategy:
      # One case that fails says nothing of the other: both go to the end.
      fail-fast: false
      matrix:
        docker: [neuf, deja-la]
    permissions:
      contents: read
      # The images still private on ghcr.io: the GITHUB_TOKEN reads them
      # through --github-token-file, as a station's own token does.
      packages: read
    # A new commit cancels the install of the one before, in the same case:
    # 3 GB each.
    concurrency:
      group: station-install-${{ matrix.docker }}-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        # With pipefail: | tee would hide a failed install.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Files of a station, from this checkout
        run: python3 scripts/version.py station main "$RUNNER_TEMP/station"
      - name: A machine like a fresh VPS
        if: matrix.docker == 'neuf'
        run: |
          # No Docker: station install puts the current one, from Docker's
          # repository, as on a fresh VPS. The runner's own goes, Compose 2.38
          # included: deja-la keeps it. So do the plugins the image adds by
          # hand, and its source of Docker's repository: a second one, with
          # another key, would stop apt-get update.
          dpkg-query -W -f '${db:Status-Abbrev} ${Package}\n' |
            awk '$1 == "ii" && $2 ~ /^(docker|containerd|moby)/ { print $2 }' > "$RUNNER_TEMP/docker-packages"
          echo "Docker du runner : $(tr '\n' ' ' < "$RUNNER_TEMP/docker-packages")"
          xargs -r -a "$RUNNER_TEMP/docker-packages" sudo apt-get purge -y -qq
          sudo rm -rf /usr/libexec/docker /usr/local/lib/docker
          sudo rm -f /etc/apt/sources.list.d/docker.list
          if command -v docker; then
            echo "::error title=Docker::docker est encore sur le runner."
            exit 1
          fi
      - name: A machine with Docker already
        if: matrix.docker == 'deja-la'
        run: |
          # The runner's Docker stays, as on a VPS that had one before:
          # station install installs nothing. Its Compose is a v2, 2.38 today,
          # as a station may still have: neuf gets the current one.
          docker version
          compose=$(docker compose version --short)
          echo "Compose du runner : $compose"
          if [[ $compose != 2.* ]]; then
            echo "::warning title=Compose::le runner a Compose $compose : ce cas ne vérifie plus d'installation avec un Compose v2."
          fi
      - name: Install
        # Well under the job's limit: a run that hangs fails here, and its
        # logs are still uploaded.
        timeout-minutes: 20
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir "$RUNNER_TEMP/out"
          (umask 077 && printf '%s\n' "$TOKEN" > "$RUNNER_TEMP/token")
          # No public domain here: Caddy signs the certificate itself, and the
          # checks go through the local ports.
          sudo bash "$RUNNER_TEMP/station/station" install --from "$RUNNER_TEMP/station/station.tar.gz" \
            --tls internal --domain radio.example --yes --github-token-file "$RUNNER_TEMP/token" 2>&1 |
            tee "$RUNNER_TEMP/out/installation.log"
      - name: Check the station
        timeout-minutes: 5
        working-directory: /opt/button
        run: |
          mode=$(sudo stat -c '%a %U' .env)
          if [ "$mode" != "600 root" ]; then
            echo "::error title=.env::/opt/button/.env est en $mode : il faut 600, à root."
            exit 1
          fi
          # The default ACL of /opt stays off the folder: what is written there
          # later, by the containers too, follows the umask.
          folder=$(stat -c '%a %U' .)
          if [ "$folder" != "755 root" ] || [ -n "$(getfacl -ps .)" ]; then
            echo "::error title=Dossier::/opt/button est en $folder, ou garde une ACL : il faut 755, à root, sans ACL."
            getfacl -p .
            exit 1
          fi
          if [ "$(readlink /usr/local/bin/station)" != /opt/button/station ]; then
            echo "::error title=Commande::/usr/local/bin/station ne mène pas à /opt/button/station."
            exit 1
          fi
          # Without a terminal, the admin password is never shown: it stays in
          # .env until an install in a terminal shows it, and in no output.
          password=$(sudo sed -n 's/^RT_ADMIN_PASSWORD=//p' .env | tail -n 1)
          if [ -z "$password" ]; then
            echo "::error title=Mot de passe admin::RT_ADMIN_PASSWORD est vide dans .env, sans avoir été affiché."
            exit 1
          fi
          if grep -qF -- "$password" "$RUNNER_TEMP/out/installation.log"; then
            echo "::error title=Mot de passe admin::la sortie de station install le contient, sans terminal."
            exit 1
          fi
          sudo scripts/smoke.sh http://127.0.0.1:30126 http://127.0.0.1:18000/radio.mp3
      - name: Install again, nothing changes
        timeout-minutes: 10
        working-directory: /opt/button
        run: |
          # Each file of the folder outside data/ and media/, with its sum,
          # then its mode and owner; each container, with its creation, then
          # the start of those running. radiotomate-init, which runs again at
          # each up, has exited.
          state() {
            sudo find . \( -path ./data -o -path ./media \) -prune -o -type f -exec sha256sum {} + | sort
            sudo find . \( -path ./data -o -path ./media \) -prune -o -printf '%M %u:%g %p\n' | sort
            sudo docker compose ps -a --format '{{.Name}} {{.CreatedAt}}' | sort
            sudo docker compose ps -q | xargs -r sudo docker inspect --format '{{.Name}} {{.State.StartedAt}}' | sort
          }
          state > "$RUNNER_TEMP/out/avant.txt"
          sudo station install --from "$RUNNER_TEMP/station/station.tar.gz" 2>&1 | tee "$RUNNER_TEMP/out/relance.log"
          state > "$RUNNER_TEMP/out/apres.txt"
          if ! diff "$RUNNER_TEMP/out/avant.txt" "$RUNNER_TEMP/out/apres.txt"; then
            echo "::error title=Relance::station install, relancé, change ce que montre le diff plus haut."
            exit 1
          fi
          password=$(sudo sed -n 's/^RT_ADMIN_PASSWORD=//p' .env | tail -n 1)
          if [ -n "$password" ] && grep -qF -- "$password" "$RUNNER_TEMP/out/relance.log"; then
            echo "::error title=Mot de passe admin::la sortie de la relance le contient, sans terminal."
            exit 1
          fi
          echo "::group::Ce que la relance n'a pas changé"
          cat "$RUNNER_TEMP/out/avant.txt"
          echo "::endgroup::"
      - name: Back up the station
        timeout-minutes: 10
        working-directory: /opt/button
        run: |
          out=$RUNNER_TEMP/out
          sudo station status 2>&1 | tee "$out/status.log"
          # What a station keeps: an account, a clock, a weekly show, a dated
          # live of the Agenda, a setting, and a sound.
          sudo station cli users add animateur-ci --password "$(openssl rand -hex 12)"
          sudo docker compose exec -T radiotomate-interface python3 - <<'PY'
          import sqlite3
          from contextlib import closing

          with closing(sqlite3.connect("/data/radiotomate.db", timeout=30)) as con, con:
              con.execute("insert into clocks (name) values ('Horloge de la CI')")
              con.execute(
                  "insert into emissions (scope, title, day_of_week, start_minute, end_minute, created, modified)"
                  " values ('weekly', 'Émission de la CI', 2, 1200, 1320, datetime('now'), datetime('now'))"
              )
              con.execute(
                  "insert into agenda_diffusions (kind, title, starts_at, ends_at, created, modified)"
                  " values ('live', 'Direct de la CI', datetime('now', '+2 days'),"
                  " datetime('now', '+2 days', '+1 hour'), datetime('now'), datetime('now'))"
              )
              con.execute("insert or replace into settings (key, value) values ('station.tagline', 'Gardée par la CI')")
          PY
          sudo mkdir -p media/30-habillage
          echo "sauvegardé par la CI" | sudo tee media/30-habillage/ci-sauvegarde.txt >/dev/null
          # Their fingerprint, without any secret: the restored station must
          # give the same.
          cat >"$RUNNER_TEMP/empreinte.py" <<'PY'
          import hashlib
          import sqlite3
          from contextlib import closing

          QUERIES = {
              "comptes": "select username, password from users order by username",
              "horloges": "select name from clocks order by name",
              "émissions": "select title, day_of_week, start_minute from emissions order by id",
              "Agenda": "select kind, title, starts_at from agenda_diffusions order by id",
              "réglages": "select key, value from settings where key like 'station.%' order by key",
          }
          with closing(sqlite3.connect("/data/radiotomate.db", timeout=30)) as con:
              for name, query in QUERIES.items():
                  rows = con.execute(query).fetchall()
                  print(name, len(rows), hashlib.sha256(repr(rows).encode()).hexdigest()[:16])
          PY
          # sudo is for docker compose, which reads .env; the script is the
          # runner's, and so are the files of out/, below too.
          # shellcheck disable=SC2024
          sudo docker compose exec -T radiotomate-interface python3 - <"$RUNNER_TEMP/empreinte.py" |
            tee "$out/empreinte-avant.txt"
          # Without a terminal, the admin password stays in .env: it must open
          # a session on the restored station.
          (umask 077 && sudo sed -n 's/^RT_ADMIN_PASSWORD=//p' .env | tail -n 1 >"$RUNNER_TEMP/admin-avant")
          if [ ! -s "$RUNNER_TEMP/admin-avant" ]; then
            echo "::error title=Mot de passe admin::RT_ADMIN_PASSWORD est vide dans .env."
            exit 1
          fi
          # In backups/, then with the sounds, out of the folder, which
          # uninstall --purge will wipe.
          sudo station backup 2>&1 | tee "$out/sauvegarde.log"
          sudo station backup "$RUNNER_TEMP/sauvegarde.tar" --with-media 2>&1 | tee -a "$out/sauvegarde.log"
          sudo sh -c 'stat -c "%a %U %n" backups backups/button-*.tar' | tee "$out/droits.txt"
          sudo stat -c '%a %U %n' "$RUNNER_TEMP/sauvegarde.tar" | tee -a "$out/droits.txt"
          wrong=$(grep -v -e '^700 root backups$' -e '^600 root ' "$out/droits.txt" || true)
          if [ -n "$wrong" ]; then
            echo "::error title=Sauvegarde::une archive n'est pas en 600, à root, ou backups/ en 700 : $wrong"
            exit 1
          fi
          # sudo reads the archive, at root; the list is the runner's.
          # shellcheck disable=SC2024
          sudo tar -tf "$RUNNER_TEMP/sauvegarde.tar" >"$out/contenu.txt"
          if ! grep -qx 'media/30-habillage/ci-sauvegarde.txt' "$out/contenu.txt"; then
            echo "::error title=Sauvegarde::l'archive --with-media n'a pas les sons."
            exit 1
          fi
          # The admin password stays in .env, never in a backup.
          if [ "$(sudo tar -xOf "$RUNNER_TEMP/sauvegarde.tar" env | sed -n 's/^RT_ADMIN_PASSWORD=//p')" != "" ]; then
            echo "::error title=Sauvegarde::l'archive porte le mot de passe admin."
            exit 1
          fi
      - name: Back up off the machine, as each night
        timeout-minutes: 15
        working-directory: /opt/button
        run: |
          out=$RUNNER_TEMP/out
          storage=$RUNNER_TEMP/stockage
          mkdir -p "$storage/donnees" "$storage/cles"
          # What the next steps share: the storage, local to the runner, with
          # no real account, and how to set it on a station.
          cat >"$RUNNER_TEMP/stockage.sh" <<'SH'
          storage=$RUNNER_TEMP/stockage
          rclone=$(sed -n 's/^ *image: *\(rclone\/rclone:[^ ]*\) *$/\1/p' /opt/button/compose.yml)

          # The storage answers, on its port of the runner.
          storage_up() { # port
            local _
            for _ in $(seq 1 30); do
              if (exec 3<>"/dev/tcp/127.0.0.1/$1") 2>/dev/null; then return 0; fi
              sleep 1
            done
            echo "::error title=Stockage::le stockage de la CI ne répond pas sur le port $1."
            sudo docker logs stockage
            return 1
          }

          # station config --backup-remote, on the station of /opt/button,
          # with what is given: the password of an existing repository. Over
          # SFTP, the station's key is authorized first: a first try makes it
          # and says to authorize it, then the storage restarts with it.
          remote_config() { # log, options…
            local log=$1
            shift
            if [ "$CASE" = neuf ]; then
              sudo station config --backup-remote s3:http://127.0.0.1:9000/sauvegardes/button \
                --backup-s3-access-key ci-acces --backup-s3-secret-key-file "$storage/secret-s3" "$@" 2>&1 | tee "$log"
              return 0
            fi
            # sudo is for station; the logs and the keys of the storage are the runner's.
            # shellcheck disable=SC2024
            if sudo station config --backup-remote sftp://ci@127.0.0.1:2222//sauvegardes/button "$@" >"$log.cle" 2>&1; then
              echo "::error title=SFTP::le stockage a pris une clé SSH qu'il ne connaissait pas."
              return 1
            fi
            if ! grep -q "que le stockage doit autoriser" "$log.cle"; then
              cat "$log.cle"
              echo "::error title=SFTP::station config ne montre pas la clé SSH à autoriser."
              return 1
            fi
            # shellcheck disable=SC2024
            sudo cat /opt/button/data/restic/ssh/id_ed25519.pub >>"$storage/cles/authorized_keys"
            if sudo docker inspect stockage >/dev/null 2>&1; then
              sudo docker restart stockage >/dev/null
            else
              sudo docker run -d --name stockage --network host -v "$storage/donnees:/data" -v "$storage/cles:/cles:ro" \
                "$rclone" serve sftp --addr 127.0.0.1:2222 --authorized-keys /cles/authorized_keys /data >/dev/null
            fi
            storage_up 2222
            sudo station config --backup-remote sftp://ci@127.0.0.1:2222//sauvegardes/button "$@" 2>&1 | tee "$log"
          }
          SH
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/stockage.sh"
          if [ "${{ matrix.docker }}" = neuf ]; then
            # rclone's S3 server, with a key drawn for this run.
            (umask 077 && openssl rand -hex 16 >"$storage/secret-s3")
            sudo docker run -d --name stockage --network host -v "$storage/donnees:/data" "$rclone" \
              serve s3 --addr 127.0.0.1:9000 --auth-key "ci-acces,$(cat "$storage/secret-s3")" /data >/dev/null
            storage_up 9000
          fi
          CASE=${{ matrix.docker }} remote_config "$out/config-sauvegarde.log"
          # The timers, enabled, and their services, run as each night and
          # each month: systemctl start waits for a oneshot service to end, and
          # fails with it.
          systemctl is-enabled button-sauvegarde.timer button-test-restauration.timer
          systemctl is-active button-sauvegarde.timer button-test-restauration.timer
          systemctl list-timers --all 'button-*' | tee "$out/minuteurs.txt"
          sudo systemctl start button-sauvegarde.service
          # sudo is for the system journal; the files of out/ are the runner's.
          # shellcheck disable=SC2024
          sudo journalctl -u button-sauvegarde --no-pager -o cat >"$out/sauvegarde-de-la-nuit.log"
          sudo systemctl start button-test-restauration.service
          # shellcheck disable=SC2024
          sudo journalctl -u button-test-restauration --no-pager -o cat >"$out/test-de-restauration.log"
          cat "$out/sauvegarde-de-la-nuit.log" "$out/test-de-restauration.log"
          line=$(sudo grep -v '^#' backups-remote.log | awk -F '\t' '$2 == "sauvegarde"' | tail -n 1)
          if [ "$(cut -f3 <<<"$line")" != faite ]; then
            echo "::error title=Sauvegarde hors de la machine::la sauvegarde de la nuit n'est pas faite : $line"
            exit 1
          fi
          # Its ID: the restore on a new machine must bring back this one.
          cut -f4 <<<"$line" >"$storage/sauvegarde"
          line=$(sudo grep -v '^#' backups-remote.log | awk -F '\t' '$2 == "test"' | tail -n 1)
          if [ "$(cut -f3 <<<"$line")" != réussi ]; then
            echo "::error title=Test de restauration::le test du mois n'a pas réussi : $line"
            exit 1
          fi
          # Nothing of it stays on the machine; the repository has the sounds.
          if [ -n "$(sudo find backups -mindepth 1 -name '.station-*')" ]; then
            echo "::error title=Sauvegarde hors de la machine::son dossier de travail reste dans backups/."
            exit 1
          fi
          sudo station restore --remote --list 2>&1 | tee "$out/liste-du-depot.txt"
          if ! grep -q "button,version:main,sons" "$out/liste-du-depot.txt"; then
            echo "::error title=Sauvegarde hors de la machine::le dépôt n'a pas de sauvegarde de cette station avec ses sons."
            exit 1
          fi
          sudo station status 2>&1 | tee "$out/status-sauvegarde.log"
          if ! grep -q "Le dernier test de restauration : le .*, réussi" "$out/status-sauvegarde.log"; then
            echo "::error title=Status::station status ne dit pas le test de restauration."
            exit 1
          fi
          # The password of the repository, noted off the machine: on the
          # runner. Without a terminal, no output shows it.
          (umask 077 && sudo sed -n 's/^BUTTON_BACKUP_PASSWORD=//p' .env | tail -n 1 >"$storage/mot-de-passe")
          if [ ! -s "$storage/mot-de-passe" ] || grep -rqF -- "$(cat "$storage/mot-de-passe")" "$out"; then
            echo "::error title=Mot de passe du dépôt::il manque à .env, ou une sortie de station le montre."
            exit 1
          fi
      - name: A fresh station, as on a new machine
        timeout-minutes: 20
        run: |
          out=$RUNNER_TEMP/out
          sudo station uninstall --purge --yes 2>&1 | tee "$out/desinstallation.log"
          if [ -e /opt/button ] || [ -e /usr/local/bin/station ] ||
            [ -n "$(sudo docker ps -aq --filter label=com.docker.compose.project=button)" ]; then
            echo "::error title=Désinstallation::après station uninstall --purge, il reste /opt/button, la commande ou un conteneur."
            exit 1
          fi
          # The backup off the machine stops with the command.
          if [ -e /etc/systemd/system/button-sauvegarde.timer ] || systemctl is-enabled button-sauvegarde.timer; then
            echo "::error title=Désinstallation::après station uninstall --purge, le minuteur de la sauvegarde hors de la machine reste."
            exit 1
          fi
          sudo bash "$RUNNER_TEMP/station/station" install --from "$RUNNER_TEMP/station/station.tar.gz" \
            --tls internal --domain radio.example --yes --github-token-file "$RUNNER_TEMP/token" 2>&1 |
            tee "$out/reinstallation.log"
          cd /opt/button
          # sudo is for docker compose, which reads .env; the script and the
          # fingerprint are the runner's.
          # shellcheck disable=SC2024
          sudo docker compose exec -T radiotomate-interface python3 - <"$RUNNER_TEMP/empreinte.py" >"$out/empreinte-neuve.txt"
          if diff -q "$out/empreinte-avant.txt" "$out/empreinte-neuve.txt"; then
            echo "::error title=Installation neuve::la station neuve a déjà les comptes de la sauvegarde : la restauration ne prouverait rien."
            exit 1
          fi
      - name: Restore the backup, the same station comes back
        timeout-minutes: 15
        working-directory: /opt/button
        run: |
          out=$RUNNER_TEMP/out
          sudo station restore "$RUNNER_TEMP/sauvegarde.tar" --yes 2>&1 | tee "$out/restauration.log"
          # sudo is for docker compose, which reads .env; the script and the
          # fingerprint are the runner's.
          # shellcheck disable=SC2024
          sudo docker compose exec -T radiotomate-interface python3 - <"$RUNNER_TEMP/empreinte.py" >"$out/empreinte-apres.txt"
          if ! diff "$out/empreinte-avant.txt" "$out/empreinte-apres.txt"; then
            echo "::error title=Restauration::la station restaurée n'a pas les comptes, les horloges, la grille, l'Agenda ou les réglages de la sauvegarde : voir le diff plus haut."
            exit 1
          fi
          if [ "$(sudo cat media/30-habillage/ci-sauvegarde.txt)" != "sauvegardé par la CI" ]; then
            echo "::error title=Restauration::les sons de la sauvegarde ne sont pas revenus."
            exit 1
          fi
          # The admin of the backup opens a session, through the console.
          code=$(jq -n --rawfile password "$RUNNER_TEMP/admin-avant" \
            '{username: "admin", password: ($password | rtrimstr("\n"))}' |
            curl -sS -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' --data @- \
              http://127.0.0.1:30126/login.json)
          if [ "$code" != 200 ]; then
            echo "::error title=Comptes::le compte admin de la sauvegarde ne se connecte pas : $code."
            exit 1
          fi
          mode=$(sudo stat -c '%a %U' .env)
          if [ "$mode" != "600 root" ]; then
            echo "::error title=.env::/opt/button/.env est en $mode après la restauration : il faut 600, à root."
            exit 1
          fi
          sudo sh -c 'ls -d data/radiotomate.avant-restauration-* .env.avant-restauration-*'
          sudo station status 2>&1 | tee "$out/status-apres.log"
          sudo scripts/smoke.sh http://127.0.0.1:30126 http://127.0.0.1:18000/radio.mp3
          # No secret in what station wrote.
          if grep -rqF -- "$(cat "$RUNNER_TEMP/admin-avant")" "$out"; then
            echo "::error title=Secrets::une sortie de station contient le mot de passe admin."
            exit 1
          fi
      - name: The machine destroyed again, the station comes back from off the machine
        timeout-minutes: 25
        run: |
          out=$RUNNER_TEMP/out
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/stockage.sh"
          sudo station uninstall --purge --yes 2>&1 | tee "$out/desinstallation-2.log"
          sudo bash "$RUNNER_TEMP/station/station" install --from "$RUNNER_TEMP/station/station.tar.gz" \
            --tls internal --domain radio.example --yes --github-token-file "$RUNNER_TEMP/token" 2>&1 |
            tee "$out/reinstallation-2.log"
          cd /opt/button
          # sudo is for docker compose, which reads .env; the script and the
          # fingerprint are the runner's.
          # shellcheck disable=SC2024
          sudo docker compose exec -T radiotomate-interface python3 - <"$RUNNER_TEMP/empreinte.py" >"$out/empreinte-neuve-2.txt"
          if diff -q "$out/empreinte-avant.txt" "$out/empreinte-neuve-2.txt"; then
            echo "::error title=Installation neuve::la station neuve a déjà les comptes de la sauvegarde : la restauration ne prouverait rien."
            exit 1
          fi
          # The same repository, with the password noted off the machine. The
          # new station, empty, has never backed up: its timers wait, or the
          # night would make it the last backup of the repository.
          CASE=${{ matrix.docker }} remote_config "$out/config-sauvegarde-2.log" --backup-password-file "$storage/mot-de-passe"
          if ! grep -q "ouvert avec son mot de passe" "$out/config-sauvegarde-2.log" ||
            ! grep -q "La sauvegarde de la nuit attend" "$out/config-sauvegarde-2.log"; then
            echo "::error title=Dépôt::la station neuve n'a pas rouvert le dépôt, ou sa sauvegarde de la nuit n'attend pas."
            exit 1
          fi
          if systemctl is-enabled --quiet button-sauvegarde.timer; then
            echo "::error title=Minuteurs::les minuteurs de la station neuve tournent avant sa restauration."
            exit 1
          fi
          # The last backup of the repository, without an ID, as after the loss
          # of a machine: the one of the night, noted above.
          sudo station restore --remote --yes 2>&1 | tee "$out/restauration-distante.log"
          if ! grep -qF ": $(cat "$storage/sauvegarde"), dans le dépôt." "$out/restauration-distante.log"; then
            echo "::error title=Restauration hors de la machine::la dernière sauvegarde du dépôt n'est pas celle de la nuit, $(cat "$storage/sauvegarde")."
            exit 1
          fi
          # shellcheck disable=SC2024
          sudo docker compose exec -T radiotomate-interface python3 - <"$RUNNER_TEMP/empreinte.py" >"$out/empreinte-distante.txt"
          if ! diff "$out/empreinte-avant.txt" "$out/empreinte-distante.txt"; then
            echo "::error title=Restauration hors de la machine::la station n'a pas les comptes, les horloges, la grille, l'Agenda ou les réglages de la sauvegarde : voir le diff plus haut."
            exit 1
          fi
          if [ "$(sudo cat media/30-habillage/ci-sauvegarde.txt)" != "sauvegardé par la CI" ]; then
            echo "::error title=Restauration hors de la machine::les sons de la sauvegarde ne sont pas revenus."
            exit 1
          fi
          code=$(jq -n --rawfile password "$RUNNER_TEMP/admin-avant" \
            '{username: "admin", password: ($password | rtrimstr("\n"))}' |
            curl -sS -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' --data @- \
              http://127.0.0.1:30126/login.json)
          if [ "$code" != 200 ]; then
            echo "::error title=Comptes::le compte admin de la sauvegarde ne se connecte pas : $code."
            exit 1
          fi
          if [ "$(sudo stat -c '%a %U' .env)" != "600 root" ]; then
            echo "::error title=.env::/opt/button/.env n'est pas en 600, à root, après la restauration."
            exit 1
          fi
          # Restored, the station takes the night back.
          systemctl is-enabled button-sauvegarde.timer button-test-restauration.timer
          systemctl is-active button-sauvegarde.timer button-test-restauration.timer
          sudo station status 2>&1 | tee "$out/status-apres-2.log"
          sudo scripts/smoke.sh http://127.0.0.1:30126 http://127.0.0.1:18000/radio.mp3
          if grep -rqF -e "$(cat "$RUNNER_TEMP/admin-avant")" -e "$(cat "$storage/mot-de-passe")" "$out"; then
            echo "::error title=Secrets::une sortie de station contient le mot de passe admin, ou celui du dépôt."
            exit 1
          fi
      - name: Logs of the station
        if: failure()
        run: |
          out=$RUNNER_TEMP/out
          mkdir -p "$out"
          if [ -f /opt/button/compose.yml ]; then
            cd /opt/button
            sudo ls -la /opt/button || true
            sudo docker compose ps -a || true
            # sudo is for docker compose, which reads .env; the file is the runner's.
            # shellcheck disable=SC2024
            sudo docker compose logs --no-color --timestamps > "$out/compose.log" 2>&1 || true
            # The backups off the machine, and their tests.
            # shellcheck disable=SC2024
            ! sudo test -f backups-remote.log || sudo cat backups-remote.log > "$out/backups-remote.log" || true
          fi
          # The timers' services, and the storage of the CI.
          # shellcheck disable=SC2024
          sudo journalctl -u button-sauvegarde -u button-test-restauration --no-pager > "$out/minuteurs.log" 2>&1 || true
          # shellcheck disable=SC2024
          sudo docker logs stockage > "$out/stockage.log" 2>&1 || true
          # The secrets of .env stay on the runner, the admin password first:
          # each value is masked in each file.
          if sudo test -f /opt/button/.env; then
            sudo sed -n -E 's/^[A-Z0-9_]*(PASSWORD|SECRET|KEY)=//p' /opt/button/.env |
              while IFS= read -r secret; do
                # $ENV is perl's, not the shell's.
                # shellcheck disable=SC2016
                [ -z "$secret" ] || SECRET=$secret find "$out" -type f -exec perl -pi -e 's/\Q$ENV{SECRET}\E/***/g' {} +
              done
          fi
      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: installation-${{ matrix.docker }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/out/
          retention-days: 14

  update:
    name: real update
    # As install: Ubuntu 24.04, what station install takes.
    runs-on: ubuntu-24.04
    # Above the sum of the steps' own limits, as in install.
    timeout-minutes: 125
    permissions:
      contents: read
      # The images still private on ghcr.io, as in install.
      packages: read
    concurrency:
      group: station-update-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Files of a station, from this checkout
        run: python3 scripts/version.py station main "$RUNNER_TEMP/station"
      - name: Two broken versions of this checkout
        run: |
          # The folder of this checkout, broken twice, as a version can be,
          # each packed like the true one. console: its engine brings one more
          # migration, which passes, then its console image exits at once:
          # the database of before must come back from under a running engine.
          # migration: its engine brings two more migrations, the second of
          # which fails, halfway. radiotomate-init, a script of the folder,
          # writes them into the image before migrating.
          for case in console migration; do
            mkdir -p "$RUNNER_TEMP/$case/files"
            tar -xzf "$RUNNER_TEMP/station/station.tar.gz" -C "$RUNNER_TEMP/$case/files"
          done
          python3 - "$RUNNER_TEMP" <<'PY'
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          compose = root / "console/files/compose.yml"
          text = compose.read_text()
          image = "    image: ${BUTTON_IMAGES:-ghcr.io/lazbutton}/button-console:${BUTTON_VERSION:-stable}\n"
          assert text.count(image) == 1, "the console image line has changed"
          compose.write_text(text.replace(image, "    image: button-ci/console-cassee:1\n    pull_policy: never\n"))

          # Once per container: a second docker compose up starts the same
          # radiotomate-init again, with the migrations already written.
          header = """# CI (MAJ-05) : des migrations de plus, dans l'image, une fois par conteneur.
          ci_dir=$(python3 -c 'import radiotomate.commands.update as u; print(u.__path__[0])')
          if [ ! -e "$ci_dir/.ci-maj05" ]; then
          ci_last=$(python3 -c 'import pkgutil, radiotomate.commands.update as u; print(max(int(m.name[1:]) for m in pkgutil.iter_modules(u.__path__) if m.name[1:].isdigit()))')
          cat >"$ci_dir/v$((ci_last + 1)).py" <<'EOF'
          async def upgrade(conn):
              await conn.exec_driver_sql("create table ci_migration (id integer primary key)")
              await conn.exec_driver_sql("insert into ci_migration (id) values (1)")


          async def downgrade(conn):
              await conn.exec_driver_sql("drop table ci_migration")
          EOF
          """
          failing = """cat >"$ci_dir/v$((ci_last + 2)).py" <<'EOF'
          async def upgrade(conn):
              raise RuntimeError("la migration de la CI échoue, exprès")


          async def downgrade(conn):
              pass
          EOF
          """
          closing = """: >"$ci_dir/.ci-maj05"
          fi
          """
          update = 'radiotomate -c "$RTCONFIG" update\n'
          for case, migrations in (("console", header + closing), ("migration", header + failing + closing)):
              init = root / case / "files/scripts/init-radiotomate.sh"
              text = init.read_text()
              assert text.count(update) == 1, "init-radiotomate.sh no longer migrates on its own line"
              init.write_text(text.replace(update, migrations + update))
          PY
          for case in console migration; do
            tar -czf "$RUNNER_TEMP/$case/station.tar.gz" -C "$RUNNER_TEMP/$case/files" .
          done
          # The console of the first: an image built here, that exits at once.
          printf 'FROM busybox:1.37\nCMD ["sh", "-c", "echo la console de la CI ne démarre pas; exit 1"]\n' |
            sudo docker build -q -t button-ci/console-cassee:1 -
      - name: Install the highest published version
        # The runner keeps its Docker, as deja-la: install checks the rest.
        timeout-minutes: 20
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/out" "$RUNNER_TEMP/publiee"
          (umask 077 && printf '%s\n' "$TOKEN" > "$RUNNER_TEMP/token")
          # The station command of that version, from its page, as on a VPS.
          curl -fsSL -o "$RUNNER_TEMP/publiee/station" \
            "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/station"
          sudo bash "$RUNNER_TEMP/publiee/station" install --tls internal --domain radio.example --yes \
            --github-token-file "$RUNNER_TEMP/token" 2>&1 | tee "$RUNNER_TEMP/out/installation.log"
          cp /opt/button/VERSION "$RUNNER_TEMP/publiee/version"
          echo "Version publiée : $(cat /opt/button/VERSION)"
      - name: What the station keeps
        timeout-minutes: 5
        working-directory: /opt/button
        run: |
          out=$RUNNER_TEMP/out
          # What a station keeps: an account, a clock, a weekly show, a dated
          # live of the Agenda and a setting; their fingerprint, before and
          # after each update. The station command of the version may only
          # have install.
          sudo docker compose exec -T radiotomate-interface \
            radiotomate users add animateur-ci --password "$(openssl rand -hex 12)"
          # The weekly show is three days from today: a version with the
          # window of MAJ-04 would refuse to update during it.
          sudo docker compose exec -T radiotomate-interface python3 - <<'PY'
          import sqlite3
          from contextlib import closing
          from datetime import datetime
          from zoneinfo import ZoneInfo

          day = (datetime.now(ZoneInfo("Europe/Paris")).weekday() + 3) % 7
          with closing(sqlite3.connect("/data/radiotomate.db", timeout=30)) as con, con:
              con.execute("insert into clocks (name) values ('Horloge de la CI')")
              con.execute(
                  "insert into emissions (scope, title, day_of_week, start_minute, end_minute, created, modified)"
                  " values ('weekly', 'Émission de la CI', ?, 1200, 1320, datetime('now'), datetime('now'))",
                  (day,),
              )
              con.execute(
                  "insert into agenda_diffusions (kind, title, starts_at, ends_at, created, modified)"
                  " values ('live', 'Direct de la CI', datetime('now', '+2 days'),"
                  " datetime('now', '+2 days', '+1 hour'), datetime('now'), datetime('now'))"
              )
              con.execute("insert or replace into settings (key, value) values ('station.tagline', 'Gardée par la CI')")
          PY
          cat >"$RUNNER_TEMP/empreinte.py" <<'PY'
          import hashlib
          import sqlite3
          from contextlib import closing

          QUERIES = {
              "comptes": "select username, password from users order by username",
              "horloges": "select name from clocks order by name",
              "émissions": "select title, day_of_week, start_minute from emissions order by id",
              "Agenda": "select kind, title, starts_at from agenda_diffusions order by id",
              "réglages": "select key, value from settings where key like 'station.%' order by key",
          }
          with closing(sqlite3.connect("/data/radiotomate.db", timeout=30)) as con:
              for name, query in QUERIES.items():
                  rows = con.execute(query).fetchall()
                  print(name, len(rows), hashlib.sha256(repr(rows).encode()).hexdigest()[:16])
          PY
          # The schema of the database, and its tables: a migration changes them.
          cat >"$RUNNER_TEMP/schema.py" <<'PY'
          import sqlite3
          from contextlib import closing

          with closing(sqlite3.connect("/data/radiotomate.db", timeout=30)) as con:
              print("schéma", con.execute("select value from settings where key = 'SCHEMA_VERSION'").fetchone()[0])
              tables = con.execute("select name from sqlite_master where type = 'table' order by name").fetchall()
              print("tables", " ".join(name for (name,) in tables))
          PY
          # sudo is for docker compose, which reads .env; the scripts and the
          # fingerprints are the runner's.
          # shellcheck disable=SC2024
          sudo docker compose exec -T radiotomate-interface python3 - <"$RUNNER_TEMP/empreinte.py" |
            tee "$out/empreinte-avant.txt"
          # shellcheck disable=SC2024
          sudo docker compose exec -T radiotomate-interface python3 - <"$RUNNER_TEMP/schema.py" |
            tee "$out/schema-avant.txt"
          # The mount the station serves: button.mp3 before ICECAST_MOUNT came,
          # radio.mp3 after, by default. The broken versions go without it, as
          # a station that takes the new address: back on the published one,
          # the station must be checked on the mount it serves.
          mount=radio.mp3
          code=$(curl -s -m 2 -o /dev/null -w '%{http_code}' http://127.0.0.1:18000/button.mp3 || true)
          if [ "$code" = 200 ]; then mount=button.mp3; fi
          echo "Mount servi : /$mount"
          echo "$mount" >"$RUNNER_TEMP/mount"
          # What the next steps share, from /opt/button.
          cat >"$RUNNER_TEMP/ci.sh" <<'SH'
          out=$RUNNER_TEMP/out
          mount=$(cat "$RUNNER_TEMP/mount")
          published=$(cat "$RUNNER_TEMP/publiee/version")

          fail() { # title, message
            echo "::error title=$1::$2"
            exit 1
          }

          # The image of each running container of the station, by service.
          images() {
            sudo docker ps -q --filter label=com.docker.compose.project=button \
              --filter label=com.docker.compose.oneoff=False |
              xargs -r sudo docker inspect --format '{{index .Config.Labels "com.docker.compose.service"}} {{.Image}}' |
              sort
          }

          # The accounts, clocks, weekly shows, Agenda and settings, by their
          # fingerprint; or the schema of the database and its tables.
          engine_python() { # script
            # shellcheck disable=SC2024
            sudo docker compose exec -T radiotomate-interface python3 - <"$1"
          }

          # The antenna, read from Icecast's local port into a file: a second of
          # the stream at a time, with its time, its status and what came.
          listen() { # file
            local answer
            while :; do
              answer=$(curl -s -m 1 -o /dev/null -w '%{http_code} %{size_download}' \
                "http://127.0.0.1:18000/$mount" || true)
              echo "$(date +%s.%N) $answer"
              [[ $answer == "200 "[1-9]* ]] || sleep 0.5
            done >"$1"
          }

          # The longest time without audio in such a file, in seconds: -1 if
          # the antenna never came back.
          longest_cut() { # file
            awk '{ ok = ($2 == 200 && $3 > 0) }
              !ok && !start { start = $1 }
              ok && start { if ($1 - start > max) max = $1 - start; start = 0 }
              END { if (start) print "-1"; else printf "%d\n", max }' "$1"
          }

          # An update to a broken version of this checkout: it must fail, then
          # come back by itself to the published version, with the same images
          # on every service, the same data and the antenna, and the database
          # of before, its schema and its tables, the migrated one kept aside;
          # block the next updates (HOLD), say so in updates.log and the system
          # journal, and keep the logs of the broken version. Then HOLD is
          # lifted, by the station command of this checkout: the published one
          # may not have unhold.
          broken_update() { # case, stage where it fails
            local case=$1 stage=$2 probe status=0 cut line aside
            images >"$out/images-avant-$case.txt"
            # The pipe stays in sh -c: under pipefail, an ls that finds
            # nothing would stop the step.
            aside=$(sudo sh -c 'ls data/radiotomate/backups/avant-restauration-*.db 2>/dev/null | wc -l')
            listen "$out/antenne-$case.txt" &
            probe=$!
            sudo bash "$RUNNER_TEMP/station/station" update --from "$RUNNER_TEMP/$case/station.tar.gz" --yes 2>&1 |
              tee "$out/mise-a-jour-$case.log" || status=$?
            sleep 5
            kill "$probe"
            [ "$status" -ne 0 ] || fail "Retour arrière" "la version cassée ($case) est passée : elle devait échouer, puis revenir seule."
            cut=$(longest_cut "$out/antenne-$case.txt")
            [ "$cut" -ge 0 ] || fail "Antenne" "l'antenne n'est pas revenue après le retour arrière ($case)."
            echo "::notice title=Retour arrière ($case)::$cut s sans audio, mise à jour ratée et retour arrière compris."
            [ "$(cat VERSION)" = "$published" ] &&
              [ "$(sudo sed -n 's/^BUTTON_VERSION=//p' .env | tail -n 1)" = "$published" ] ||
              fail "Version" "la station n'est pas revenue en $published ($case)."
            line=$(sudo grep -v '^#' updates.log | tail -n 1)
            [ "$(cut -f2-4 <<<"$line")" = "$(printf '%s\tmain\tannulée' "$published")" ] &&
              [[ $(cut -f6 <<<"$line") == "pendant le $stage ; revenue en $published, avec la base d'avant la mise à jour"* ]] ||
              fail "updates.log" "la dernière ligne n'est pas celle d'une mise à jour annulée pendant le $stage ($case) : $line"
            sudo test -f HOLD || fail "HOLD" "le retour arrière n'a pas posé HOLD ($case)."
            sudo journalctl -t button --no-pager -o cat |
              grep -qF "Mise à jour annulée : la mise à jour de $published à main a échoué pendant le $stage" ||
              fail "Alerte" "l'alerte « mise à jour annulée » n'est pas dans le journal du système ($case)."
            sudo test -s updates-failed.log || fail "Journaux" "les journaux de la version cassée ne sont pas gardés ($case)."
            images >"$out/images-apres-$case.txt"
            diff "$out/images-avant-$case.txt" "$out/images-apres-$case.txt" ||
              fail "Images" "les services ne sont pas revenus aux images d'avant ($case) : voir le diff plus haut."
            engine_python "$RUNNER_TEMP/empreinte.py" >"$out/empreinte-$case.txt"
            diff "$out/empreinte-avant.txt" "$out/empreinte-$case.txt" ||
              fail "Données" "le retour arrière a changé les comptes, les horloges, la grille, l'Agenda ou les réglages ($case)."
            engine_python "$RUNNER_TEMP/schema.py" >"$out/schema-$case.txt"
            diff "$out/schema-avant.txt" "$out/schema-$case.txt" ||
              fail "Base" "la base n'est pas celle d'avant la mise à jour ($case) : voir le diff plus haut."
            [ "$(sudo sh -c 'ls data/radiotomate/backups/avant-restauration-*.db 2>/dev/null | wc -l')" -eq $((aside + 1)) ] ||
              fail "Base" "la base de la version cassée n'est pas gardée à côté ($case)."
            sudo scripts/smoke.sh http://127.0.0.1:30126 "http://127.0.0.1:18000/$mount"
            sudo bash "$RUNNER_TEMP/station/station" unhold
          }
          SH
      - name: A version whose console does not start, after its migration, comes back by itself
        timeout-minutes: 20
        working-directory: /opt/button
        run: |
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/ci.sh"
          broken_update console contrôle
          sudo grep -q "la console de la CI ne démarre pas" updates-failed.log ||
            fail "Journaux" "les journaux gardés n'ont pas ceux de la console cassée."
      - name: A migration that fails halfway comes back by itself, database included
        timeout-minutes: 20
        working-directory: /opt/button
        run: |
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/ci.sh"
          broken_update migration redémarrage
          sudo grep -q "la migration de la CI échoue" updates-failed.log ||
            fail "Journaux" "les journaux gardés n'ont pas l'échec de la migration."
      - name: Update to this checkout, the antenna listened to
        timeout-minutes: 30
        working-directory: /opt/button
        run: |
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/ci.sh"
          # The action that 1.0.0 asks of a station installed before it: keep
          # the address of its stream, in .env.
          if ! sudo grep -q '^ICECAST_MOUNT=' .env; then
            echo "ICECAST_MOUNT=$mount" | sudo tee -a .env >/dev/null
          fi
          listen "$out/antenne.txt" &
          probe=$!
          sudo bash "$RUNNER_TEMP/station/station" update --from "$RUNNER_TEMP/station/station.tar.gz" --yes 2>&1 |
            tee "$out/mise-a-jour.log"
          sleep 5
          kill "$probe"
          # The longest time without audio, in seconds: what the fiche MAJ-04
          # accepts is under 30.
          cut=$(longest_cut "$out/antenne.txt")
          echo "::notice title=Coupure de l'antenne::$cut s sans audio pendant la mise à jour."
          if [ "$cut" -lt 0 ] || [ "$cut" -ge 30 ]; then
            echo "::error title=Coupure de l'antenne::l'antenne s'est coupée $cut s (-1 : jamais revenue) : il faut moins de 30 s."
            exit 1
          fi
          if [ "$(cat VERSION)" != main ] || [ "$(sudo sed -n 's/^BUTTON_VERSION=//p' .env | tail -n 1)" != main ]; then
            echo "::error title=Version::la station n'est pas passée à main."
            exit 1
          fi
          engine_python "$RUNNER_TEMP/empreinte.py" >"$out/empreinte-apres.txt"
          if ! diff "$out/empreinte-avant.txt" "$out/empreinte-apres.txt"; then
            echo "::error title=Données::la mise à jour a changé les comptes, les horloges, la grille, l'Agenda ou les réglages : voir le diff plus haut."
            exit 1
          fi
          line=$(sudo grep -v '^#' updates.log | tail -n 1)
          if [ "$(cut -f3,4 <<<"$line")" != "$(printf 'main\tfaite')" ] || ! sudo test -f "$(cut -f5 <<<"$line")"; then
            echo "::error title=Mise à jour::il manque la sauvegarde d'avant, ou la ligne de updates.log : $line"
            exit 1
          fi
          # The version of each service, for GET /system/version.json.
          sudo jq -e '.version == "main" and (.services | map(.service) | index("radiotomate-playout"))' \
            data/radiotomate/versions.json
          sudo station status 2>&1 | tee "$out/status.log"
          sudo scripts/smoke.sh http://127.0.0.1:30126 "http://127.0.0.1:18000/$mount"
      - name: Requests of the console, taken by the timer of the host
        timeout-minutes: 25
        working-directory: /opt/button
        run: |
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/ci.sh"
          # The timer of the requests, put by the update to this checkout, and
          # its service, as systemd runs it each minute.
          systemctl is-enabled --quiet button-demandes.timer ||
            fail "Demandes" "le minuteur des demandes de la console n'est pas activé."
          sudo systemctl start button-demandes.service ||
            fail "Demandes" "le service des demandes de la console échoue : voir journalctl -u button-demandes."
          if ! sudo docker compose exec -T radiotomate-interface radiotomate maintenance updates show </dev/null >/dev/null 2>&1; then
            echo "::notice title=Demandes de la console::le moteur :main n'a pas encore radiotomate maintenance updates : le passage par une demande se fera une fois la branche fusionnée."
            exit 0
          fi

          # A request, as the button writes it, by the function of its route;
          # the timer takes it within a minute, and the update takes a few, the
          # engine silent while it restarts. A station on main updates from an
          # archive only: the timer takes the one given, by a drop-in of the
          # CI, not of the station. The result of the request goes in result,
          # once checked that it is the one asked.
          ask() { # archive
            local id open last deadline=$((SECONDS + 600))
            result=""
            sudo mkdir -p /etc/systemd/system/button-demandes.service.d
            printf '[Service]\nExecStart=\nExecStart="/opt/button/station" requests --dir "/opt/button" --from "%s"\n' "$1" |
              sudo tee /etc/systemd/system/button-demandes.service.d/ci.conf >/dev/null
            sudo systemctl daemon-reload
            id=$(sudo docker compose exec -T radiotomate-interface python3 -c '
          from pathlib import Path
          from radiotomate.services import updates
          print(updates.ask(Path("/data"), "ci", None, "main")["id"])')
            while :; do
              open=$(sudo docker compose exec -T radiotomate-interface radiotomate maintenance updates show </dev/null 2>/dev/null || echo "?")
              [ -n "$open" ] || break
              [ "$SECONDS" -lt "$deadline" ] || fail "Demandes" "la demande $id n'est pas finie au bout de 10 min : $open"
              sleep 10
            done
            last=$(sudo docker compose exec -T radiotomate-interface python3 -c '
          import json
          last = json.load(open("/data/updates/last.json"))
          print(last["id"], last["result"])')
            [ "${last%% *}" = "$id" ] || fail "Demandes" "la dernière demande close n'est pas $id : $last"
            result=${last#* }
            echo "Demande $id : $result"
          }

          # The first broken version: its console does not start, and the
          # station comes back by itself; the engine is told so, and HOLD.
          ask "$RUNNER_TEMP/console/station.tar.gz"
          [ "$result" = rolled_back ] ||
            fail "Demandes" "la mise à jour cassée, demandée par la console, a fini $result, pas annulée."
          sudo test -f HOLD || fail "Demandes" "la mise à jour annulée n'a pas posé HOLD."
          [ "$(sudo grep -v '^#' updates.log | tail -n 1 | cut -f2-4)" = "$(printf 'main\tmain\tannulée')" ] ||
            fail "Demandes" "updates.log n'a pas la mise à jour annulée de la demande."
          sudo docker compose exec -T radiotomate-interface python3 -c '
          import json
          assert json.load(open("/data/updates/host.json"))["hold"], "HOLD manque au moteur"' ||
            fail "Demandes" "le moteur ne sait pas que HOLD bloque les mises à jour."

          # HOLD refuses the next one, without updating.
          lines=$(sudo sh -c 'wc -l < updates.log')
          ask "$RUNNER_TEMP/station/station.tar.gz"
          [ "$result" = refused ] || fail "Demandes" "une demande devant HOLD a fini $result, pas refusée."
          [ "$(sudo sh -c 'wc -l < updates.log')" -eq "$lines" ] ||
            fail "Demandes" "une demande refusée a lancé une mise à jour."

          # HOLD lifted, the folder of this checkout: done.
          sudo bash station unhold
          ask "$RUNNER_TEMP/station/station.tar.gz"
          [ "$result" = "done" ] || fail "Demandes" "la demande a fini $result, pas faite."
          [ "$(sudo grep -v '^#' updates.log | tail -n 1 | cut -f2-4)" = "$(printf 'main\tmain\tfaite')" ] ||
            fail "Demandes" "updates.log n'a pas la mise à jour de la demande."
          sudo journalctl -u button-demandes --no-pager -o cat | grep -qF "Demande de la console : faite." ||
            fail "Demandes" "le journal du service n'a pas le résultat de la demande."
          sudo rm -r /etc/systemd/system/button-demandes.service.d
          sudo systemctl daemon-reload
          sudo scripts/smoke.sh http://127.0.0.1:30126 "http://127.0.0.1:18000/$mount"
      - name: Logs of the station
        if: failure()
        run: |
          out=$RUNNER_TEMP/out
          mkdir -p "$out"
          if [ -f /opt/button/compose.yml ]; then
            cd /opt/button
            sudo ls -la /opt/button || true
            sudo docker compose ps -a || true
            # sudo is for docker compose, which reads .env; the file is the runner's.
            # shellcheck disable=SC2024
            sudo docker compose logs --no-color --timestamps > "$out/compose.log" 2>&1 || true
            # The requests of the console, as the timer of the host ran them.
            sudo journalctl -u button-demandes --no-pager > "$out/demandes.log" 2>&1 || true
            # The updates, HOLD, and the logs of a broken version that came back.
            for file in updates.log HOLD updates-failed.log; do
              # shellcheck disable=SC2024
              ! sudo test -f "$file" || sudo cat "$file" > "$out/$file" || true
            done
          fi
          # The secrets of .env stay on the runner: each value is masked.
          if sudo test -f /opt/button/.env; then
            sudo sed -n -E 's/^[A-Z0-9_]*(PASSWORD|SECRET|KEY)=//p' /opt/button/.env |
              while IFS= read -r secret; do
                # $ENV is perl's, not the shell's.
                # shellcheck disable=SC2016
                [ -z "$secret" ] || SECRET=$secret find "$out" -type f -exec perl -pi -e 's/\Q$ENV{SECRET}\E/***/g' {} +
              done
          fi
      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mise-a-jour-${{ github.run_attempt }}
          path: ${{ runner.temp }}/out/
          retention-days: 14
