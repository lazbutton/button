name: station

# The station command, deploy/station, in two jobs.
#
# bats: its tests, on a machine played by fake tools (deploy/tests/fakes/),
# without containers or network. In the official bats image, at a pinned
# version, with its bats-support and bats-assert. scripts/verifier.sh (deploy)
# runs the same image, read from here: the image alone on its line. Dependabot
# does not follow the image: bump it by hand. ShellCheck checks the script and
# its tests (shellcheck.yml).
#
# install: a real install, on a fresh runner, of what the fakes cannot see.
# The folder of the station is packed from this checkout, as for a version
# (scripts/version.py station main); the images are the :main ones of the
# registry, not built here: a pull request that changes an image and the
# folder together is only checked whole once merged. Then the smoke check,
# and a second install, which must change no file of the folder and no
# container. The runner keeps the default ACL of /opt, open to every account:
# station install must keep it off .env and off the folder. It pulls about
# 3 GB of images: hence the paths below, what a real install runs, and not
# every pull request.

on:
  push:
    branches: [main]
    paths:
      - "deploy/station"
      - "deploy/tests/**"
      - "deploy/compose.yml"
      - "deploy/Caddyfile"
      - "deploy/scripts/**"
      - "scripts/version.py"
      - ".github/workflows/station.yml"
  pull_request:
    paths:
      - "deploy/station"
      - "deploy/tests/**"
      - "deploy/compose.yml"
      - "deploy/Caddyfile"
      - "deploy/scripts/**"
      - "scripts/version.py"
      - ".github/workflows/station.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bats:
    name: bats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The tests of deploy/station
        run: >
          docker run --rm -v "$PWD:/code:ro" -w /code
          docker.io/bats/bats:1.13.0
          deploy/tests

  install:
    name: real install
    # Not ubuntu-latest: station install takes Ubuntu 24.04, not the next one.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      # The images still private on ghcr.io: the GITHUB_TOKEN reads them
      # through --github-token-file, as a station's own token does.
      packages: read
    # A new commit cancels the install of the one before: 3 GB each.
    concurrency:
      group: station-install-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        # With pipefail: | tee would hide a failed install.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Files of a station, from this checkout
        run: python3 scripts/version.py station main "$RUNNER_TEMP/station"
      - name: A machine like a fresh VPS
        run: |
          # No Docker: station install puts the current one, from Docker's
          # repository, as on a fresh VPS. The runner's own goes, Compose 2.38
          # included: services.yml reads compose.yml with a Compose v2. So do
          # the plugins the image adds by hand, and its source of Docker's
          # repository: a second one, with another key, would stop apt-get
          # update.
          dpkg-query -W -f '${db:Status-Abbrev} ${Package}\n' |
            awk '$1 == "ii" && $2 ~ /^(docker|containerd|moby)/ { print $2 }' > "$RUNNER_TEMP/docker-packages"
          echo "Docker du runner : $(tr '\n' ' ' < "$RUNNER_TEMP/docker-packages")"
          xargs -r -a "$RUNNER_TEMP/docker-packages" sudo apt-get purge -y -qq
          sudo rm -rf /usr/libexec/docker /usr/local/lib/docker
          sudo rm -f /etc/apt/sources.list.d/docker.list
          if command -v docker; then
            echo "::error title=Docker::docker est encore sur le runner."
            exit 1
          fi
      - name: Install
        # Well under the job's limit: a run that hangs fails here, and its
        # logs are still uploaded.
        timeout-minutes: 20
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir "$RUNNER_TEMP/out"
          (umask 077 && printf '%s\n' "$TOKEN" > "$RUNNER_TEMP/token")
          # No public domain here: Caddy signs the certificate itself, and the
          # checks go through the local ports.
          sudo bash "$RUNNER_TEMP/station/station" install --from "$RUNNER_TEMP/station/station.tar.gz" \
            --tls internal --domain radio.example --yes --github-token-file "$RUNNER_TEMP/token" 2>&1 |
            tee "$RUNNER_TEMP/out/installation.log"
      - name: Check the station
        timeout-minutes: 5
        working-directory: /opt/button
        run: |
          mode=$(sudo stat -c '%a %U' .env)
          if [ "$mode" != "600 root" ]; then
            echo "::error title=.env::/opt/button/.env est en $mode : il faut 600, à root."
            exit 1
          fi
          # The default ACL of /opt stays off the folder: what is written there
          # later, by the containers too, follows the umask.
          folder=$(stat -c '%a %U' .)
          if [ "$folder" != "755 root" ] || [ -n "$(getfacl -ps .)" ]; then
            echo "::error title=Dossier::/opt/button est en $folder, ou garde une ACL : il faut 755, à root, sans ACL."
            getfacl -p .
            exit 1
          fi
          if [ "$(readlink /usr/local/bin/station)" != /opt/button/station ]; then
            echo "::error title=Commande::/usr/local/bin/station ne mène pas à /opt/button/station."
            exit 1
          fi
          # Without a terminal, the admin password is never shown: it stays in
          # .env until an install in a terminal shows it, and in no output.
          password=$(sudo sed -n 's/^RT_ADMIN_PASSWORD=//p' .env | tail -n 1)
          if [ -z "$password" ]; then
            echo "::error title=Mot de passe admin::RT_ADMIN_PASSWORD est vide dans .env, sans avoir été affiché."
            exit 1
          fi
          if grep -qF -- "$password" "$RUNNER_TEMP/out/installation.log"; then
            echo "::error title=Mot de passe admin::la sortie de station install le contient, sans terminal."
            exit 1
          fi
          sudo scripts/smoke.sh http://127.0.0.1:30126 http://127.0.0.1:18000/button.mp3
      - name: Install again, nothing changes
        timeout-minutes: 10
        working-directory: /opt/button
        run: |
          # Each file of the folder outside data/ and media/, with its sum,
          # then its mode and owner; each container, with its creation, then
          # the start of those running. radiotomate-init, which runs again at
          # each up, has exited.
          state() {
            sudo find . \( -path ./data -o -path ./media \) -prune -o -type f -exec sha256sum {} + | sort
            sudo find . \( -path ./data -o -path ./media \) -prune -o -printf '%M %u:%g %p\n' | sort
            sudo docker compose ps -a --format '{{.Name}} {{.CreatedAt}}' | sort
            sudo docker compose ps -q | xargs -r sudo docker inspect --format '{{.Name}} {{.State.StartedAt}}' | sort
          }
          state > "$RUNNER_TEMP/out/avant.txt"
          sudo station install --from "$RUNNER_TEMP/station/station.tar.gz" 2>&1 | tee "$RUNNER_TEMP/out/relance.log"
          state > "$RUNNER_TEMP/out/apres.txt"
          if ! diff "$RUNNER_TEMP/out/avant.txt" "$RUNNER_TEMP/out/apres.txt"; then
            echo "::error title=Relance::station install, relancé, change ce que montre le diff plus haut."
            exit 1
          fi
          password=$(sudo sed -n 's/^RT_ADMIN_PASSWORD=//p' .env | tail -n 1)
          if [ -n "$password" ] && grep -qF -- "$password" "$RUNNER_TEMP/out/relance.log"; then
            echo "::error title=Mot de passe admin::la sortie de la relance le contient, sans terminal."
            exit 1
          fi
          echo "::group::Ce que la relance n'a pas changé"
          cat "$RUNNER_TEMP/out/avant.txt"
          echo "::endgroup::"
      - name: Logs of the station
        if: failure()
        run: |
          out=$RUNNER_TEMP/out
          mkdir -p "$out"
          if [ -f /opt/button/compose.yml ]; then
            cd /opt/button
            sudo ls -la /opt/button || true
            sudo docker compose ps -a || true
            # sudo is for docker compose, which reads .env; the file is the runner's.
            # shellcheck disable=SC2024
            sudo docker compose logs --no-color --timestamps > "$out/compose.log" 2>&1 || true
          fi
          # The secrets of .env stay on the runner, the admin password first:
          # each value is masked in each file.
          if sudo test -f /opt/button/.env; then
            sudo sed -n -E 's/^[A-Z0-9_]*(PASSWORD|SECRET|KEY)=//p' /opt/button/.env |
              while IFS= read -r secret; do
                # $ENV is perl's, not the shell's.
                # shellcheck disable=SC2016
                [ -z "$secret" ] || SECRET=$secret find "$out" -type f -exec perl -pi -e 's/\Q$ENV{SECRET}\E/***/g' {} +
              done
          fi
      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: installation-${{ github.run_attempt }}
          path: ${{ runner.temp }}/out/
          retention-days: 14
