name: services

# Icecast, nowplaying and the catalogue: the side services of the stack.
# The catalogue tests run first; the images are pushed only from main.

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "!services/**/*.md"
      - "deploy/scripts/**"
      - "!deploy/scripts/**/*.md"
      - "deploy/share/**"
      - "!deploy/share/**/*.md"
      - "deploy/compose.yml"
      - ".github/workflows/services.yml"
  pull_request:
    paths:
      - "services/**"
      - "!services/**/*.md"
      - "deploy/scripts/**"
      - "!deploy/scripts/**/*.md"
      - "deploy/share/**"
      - "!deploy/share/**/*.md"
      - "deploy/compose.yml"
      - ".github/workflows/services.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  check:
    name: catalogue tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/catalog
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python test_inbox_api.py
      - run: python test_agenda_api.py
      - run: python test_refresh_volume.py
      - run: python test_promote_inplace.py
      - run: python test_share.py
      - run: python test_volume_api.py
      - run: python test_session.py
      - run: python test_init_secrets.py
      - run: python test_icecast_config.py
      - run: python test_smoke.py

  docker:
    name: build & push images
    needs: [check]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Dated tag
        id: tag
        run: echo "dated=$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Build and push Icecast
        uses: docker/build-push-action@v7
        with:
          context: ./services/icecast
          platforms: linux/amd64
          push: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/button-icecast:main
            ghcr.io/${{ github.repository_owner }}/button-icecast:${{ steps.tag.outputs.dated }}
            ghcr.io/${{ github.repository_owner }}/button-icecast:${{ github.sha }}
          cache-from: type=gha,scope=icecast
          cache-to: type=gha,mode=max,scope=icecast
      - name: Build and push nowplaying
        uses: docker/build-push-action@v7
        with:
          context: ./services/nowplaying
          platforms: linux/amd64
          push: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/button-nowplaying:main
            ghcr.io/${{ github.repository_owner }}/button-nowplaying:${{ steps.tag.outputs.dated }}
            ghcr.io/${{ github.repository_owner }}/button-nowplaying:${{ github.sha }}
          cache-from: type=gha,scope=nowplaying
          cache-to: type=gha,mode=max,scope=nowplaying
      - name: Build and push catalogue
        uses: docker/build-push-action@v7
        with:
          # Repository root: the image also ships deploy/scripts/setup-media-tree.sh.
          context: .
          file: ./services/catalog/Dockerfile
          platforms: linux/amd64
          push: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/button-catalog:main
            ghcr.io/${{ github.repository_owner }}/button-catalog:${{ steps.tag.outputs.dated }}
            ghcr.io/${{ github.repository_owner }}/button-catalog:${{ github.sha }}
          cache-from: type=gha,scope=catalog
          cache-to: type=gha,mode=max,scope=catalog
      - name: Build and push share
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./deploy/share/Dockerfile
          platforms: linux/amd64
          push: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/button-share:main
            ghcr.io/${{ github.repository_owner }}/button-share:${{ steps.tag.outputs.dated }}
            ghcr.io/${{ github.repository_owner }}/button-share:${{ github.sha }}
          cache-from: type=gha,scope=share
          cache-to: type=gha,mode=max,scope=share

  trivy:
    name: Trivy
    # After the push, never before: a critical vulnerability turns the run red
    # but does not hold back the images and the fixes they carry.
    needs: [docker]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/failles.yml
    with:
      images: >-
        ghcr.io/${{ github.repository_owner }}/button-icecast:${{ github.sha }}
        ghcr.io/${{ github.repository_owner }}/button-nowplaying:${{ github.sha }}
        ghcr.io/${{ github.repository_owner }}/button-catalog:${{ github.sha }}
        ghcr.io/${{ github.repository_owner }}/button-share:${{ github.sha }}
