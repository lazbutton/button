name: services

# Icecast, nowplaying, the catalogue and the shared folder: the side services
# of the stack. The catalogue tests run first; the images are pushed only from
# main, or from a version tag, vX.Y.Z, through version.yml.

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "!services/**/*.md"
      - "deploy/scripts/**"
      - "!deploy/scripts/**/*.md"
      - "deploy/share/**"
      - "!deploy/share/**/*.md"
      - "deploy/compose.yml"
      - ".github/workflows/services.yml"
  pull_request:
    paths:
      - "services/**"
      - "!services/**/*.md"
      - "deploy/scripts/**"
      - "!deploy/scripts/**/*.md"
      - "deploy/share/**"
      - "!deploy/share/**/*.md"
      - "deploy/compose.yml"
      - ".github/workflows/services.yml"
      # test_cloud_sync.py checks the Dropbox bridge against the engine's audio
      # formats. Pull requests only: no service image depends on this file.
      - "engine/radiotomate/services/media_bank.py"
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: The version to publish, X.Y.Z. Only version.yml calls this workflow.
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  check:
    name: catalogue tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/catalog
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Same interpreter as the images of the catalogue and nowplaying
          # (python:3.13-slim-bookworm)
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python test_inbox_api.py
      - run: python test_bank_api.py
      - run: python test_agenda_api.py
      - run: python test_refresh_volume.py
      - run: python test_promote_inplace.py
      - run: python test_beets_import_loop.py
      - run: python test_share.py
      - run: python test_volume_api.py
      - run: python test_session.py
      - run: python test_init_secrets.py
      - run: python test_icecast_config.py
      - run: python test_nowplaying.py
      - run: python test_smoke.py
      - run: python test_cloud_sync.py
      - run: python test_media_tree.py
      - run: python test_compose.py
      - name: test_compose.py, with Compose v2
        env:
          # A station may still run Compose v2, which reads compose.yml
          # otherwise than the Compose 5 of ubuntu-latest: it evaluates every
          # branch of a ${…}, even the one not taken. This pinned image has
          # Compose 2.39.2; a new one must keep a v2. scripts/verifier.sh
          # (services) reads it here, alone on its line.
          COMPOSE_IMAGE: docker.io/library/docker:28.3.3-cli
        run: |
          version=$(docker run --rm "$COMPOSE_IMAGE" docker compose version --short)
          echo "Compose $version, from $COMPOSE_IMAGE"
          if [ "${version%%.*}" != 2 ]; then
            echo "::error title=Compose v2::$COMPOSE_IMAGE a Compose $version : il faut une image avec un Compose v2."
            exit 1
          fi
          python test_compose.py

  docker:
    name: build & push images
    needs: [check]
    # From main, or for a version, through version.yml. "Run workflow" has no
    # version input: it never builds one.
    if: >-
      inputs.version != ''
      || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tags
        id: tags
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # From main: main, a dated tag and the full SHA. For a version: X.Y.Z
        # only; version.yml adds X.Y and stable once the seven images are in.
        # A published version is never rebuilt: "Re-run all jobs" skips the
        # build, and version.yml finishes the publication. The run of a tag
        # moved since builds nothing.
        run: |
          if [ -n "$VERSION" ]; then
            tagged=$(git ls-remote origin "refs/tags/v$VERSION" "refs/tags/v$VERSION^{}" | tail -n 1 | cut -f1)
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error title=Version $VERSION::v$VERSION ne pointe plus sur le commit de ce run : seul le run du tag actuel publie."
              exit 1
            fi
            if [ "$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
              echo "::notice title=Version $VERSION::Déjà publiée : rien à reconstruire."
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            tags=("$VERSION")
          else
            VERSION=$(date -u +%Y%m%d)-${GITHUB_SHA::7}
            tags=(main "$VERSION" "$GITHUB_SHA")
          fi
          {
            echo "version=$VERSION"
            for image in icecast nowplaying catalog share; do
              echo "$image<<EOF"
              for tag in "${tags[@]}"; do echo "$REGISTRY/button-$image:$tag"; done
              echo "EOF"
            done
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        if: steps.tags.outputs.published != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
        if: steps.tags.outputs.published != 'true'
      - name: Build and push Icecast
        if: steps.tags.outputs.published != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./services/icecast
          platforms: linux/amd64
          push: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.icecast }}
          cache-from: type=gha,scope=icecast
          # A version reads the cache of main and writes none: a cache written
          # under a tag serves no other run, and pushes out those of main.
          cache-to: ${{ inputs.version == '' && 'type=gha,mode=max,scope=icecast' || '' }}
      - name: Build and push nowplaying
        if: steps.tags.outputs.published != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./services/nowplaying
          platforms: linux/amd64
          push: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.nowplaying }}
          cache-from: type=gha,scope=nowplaying
          cache-to: ${{ inputs.version == '' && 'type=gha,mode=max,scope=nowplaying' || '' }}
      - name: Build and push catalogue
        if: steps.tags.outputs.published != 'true'
        uses: docker/build-push-action@v7
        with:
          # Repository root: the image also ships deploy/scripts/setup-media-tree.sh.
          context: .
          file: ./services/catalog/Dockerfile
          platforms: linux/amd64
          push: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.catalog }}
          cache-from: type=gha,scope=catalog
          cache-to: ${{ inputs.version == '' && 'type=gha,mode=max,scope=catalog' || '' }}
      - name: Build and push share
        if: steps.tags.outputs.published != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./deploy/share/Dockerfile
          platforms: linux/amd64
          push: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.share }}
          cache-from: type=gha,scope=share
          cache-to: ${{ inputs.version == '' && 'type=gha,mode=max,scope=share' || '' }}

  trivy:
    name: Trivy
    # After the push, never before: a critical vulnerability turns the run red
    # but does not hold back the images and the fixes they carry. A version is
    # scanned by version.yml, once published.
    needs: [docker]
    if: inputs.version == ''
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/failles.yml
    with:
      images: >-
        ghcr.io/${{ github.repository_owner }}/button-icecast:${{ github.sha }}
        ghcr.io/${{ github.repository_owner }}/button-nowplaying:${{ github.sha }}
        ghcr.io/${{ github.repository_owner }}/button-catalog:${{ github.sha }}
        ghcr.io/${{ github.repository_owner }}/button-share:${{ github.sha }}
