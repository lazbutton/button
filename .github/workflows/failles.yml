name: failles

# Trivy on the published images: fails on any critical vulnerability, except
# those accepted in .trivyignore.yaml, each with its reason and an expiry date.
# It never holds a publication back: a station that follows :main must keep
# receiving fixes. console.yml, engine.yml and services.yml call it right after
# their push. Every Monday it also scans the :main images, since a new
# vulnerability also hits an image that has not changed.

on:
  workflow_call:
    inputs:
      images:
        description: The images to scan, separated by spaces or new lines.
        type: string
        required: true
  schedule:
    - cron: "23 5 * * 1"
  pull_request:
    paths:
      - ".trivyignore.yaml"
      - ".github/workflows/failles.yml"
  workflow_dispatch:
    inputs:
      images:
        description: The images to scan, separated by spaces. Empty, the :main images.
        type: string
        required: false

permissions:
  contents: read
  packages: read

jobs:
  trivy:
    name: Trivy, critical vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Trivy
        # Version and checksum pinned together: Trivy's release channels were
        # compromised in March 2026 (GHSA-69fq-xp46-6x23). To upgrade, take
        # both from the release's trivy_<version>_checksums.txt.
        env:
          TRIVY_VERSION: 0.76.1
          TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
        run: |
          archive="$RUNNER_TEMP/trivy.tar.gz"
          curl -sSfLo "$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v$TRIVY_VERSION/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "$TRIVY_SHA256  $archive" | sha256sum -c -
          mkdir "$RUNNER_TEMP/trivy"
          tar -xzf "$archive" -C "$RUNNER_TEMP/trivy" trivy
          echo "$RUNNER_TEMP/trivy" >> "$GITHUB_PATH"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan
        env:
          IMAGES: ${{ inputs.images }}
          OWNER: ${{ github.repository_owner }}
          TRIVY_DISABLE_TELEMETRY: "true"
          TRIVY_SKIP_VERSION_CHECK: "true"
        run: |
          # No input (schedule, pull request, by hand): the seven :main images.
          if [ -z "$IMAGES" ]; then
            for name in console radiotomate playout icecast nowplaying catalog share; do
              IMAGES="$IMAGES ghcr.io/$OWNER/button-$name:main"
            done
          fi
          failed=""
          for image in $IMAGES; do
            echo "== $image"
            trivy image --scanners vuln --severity CRITICAL --no-progress \
              --ignorefile .trivyignore.yaml --exit-code 1 "$image" || failed="$failed $image"
          done
          for image in $failed; do
            echo "::error title=Trivy::$image : faille critique hors de .trivyignore.yaml, ou analyse impossible (voir le journal)"
          done
          [ -z "$failed" ]
