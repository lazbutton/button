name: console

# Type-check, tests and build first; the image is pushed only from main, or
# from a version tag, vX.Y.Z, through version.yml.

on:
  push:
    branches: [main]
    paths:
      - "console/**"
      - "!console/**/*.md"
      - ".github/workflows/console.yml"
  pull_request:
    paths:
      - "console/**"
      - "!console/**/*.md"
      - ".github/workflows/console.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: The version to publish, X.Y.Z. Only version.yml calls this workflow.
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  check:
    name: tsc, tests, vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    name: build & push image
    needs: [check]
    # From main, or for a version, through version.yml. "Run workflow" has no
    # version input: it never builds one.
    if: >-
      inputs.version != ''
      || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tags
        id: tags
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # From main: main, a dated tag and the full SHA. For a version: X.Y.Z
        # only; version.yml adds X.Y and stable once the seven images are in.
        # A published version is never rebuilt: "Re-run all jobs" skips the
        # build, and version.yml finishes the publication. The run of a tag
        # moved since builds nothing.
        run: |
          if [ -n "$VERSION" ]; then
            tagged=$(git ls-remote origin "refs/tags/v$VERSION" "refs/tags/v$VERSION^{}" | tail -n 1 | cut -f1)
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error title=Version $VERSION::v$VERSION ne pointe plus sur le commit de ce run : seul le run du tag actuel publie."
              exit 1
            fi
            if [ "$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
              echo "::notice title=Version $VERSION::Déjà publiée : rien à reconstruire."
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            tags=("$VERSION")
          else
            VERSION=$(date -u +%Y%m%d)-${GITHUB_SHA::7}
            tags=(main "$VERSION" "$GITHUB_SHA")
          fi
          {
            echo "version=$VERSION"
            for image in console; do
              echo "$image<<EOF"
              for tag in "${tags[@]}"; do echo "$REGISTRY/button-$image:$tag"; done
              echo "EOF"
            done
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        if: steps.tags.outputs.published != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
        if: steps.tags.outputs.published != 'true'
      - uses: docker/build-push-action@v7
        if: steps.tags.outputs.published != 'true'
        with:
          context: ./console
          platforms: linux/amd64
          # The serve stage upgrades Alpine's packages: from the cache, it
          # would keep those of its first build. The npm build stays cached.
          no-cache-filters: serve
          push: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.console }}
          cache-from: type=gha,scope=console
          # A version reads the cache of main and writes none: a cache written
          # under a tag serves no other run, and pushes out those of main.
          cache-to: ${{ inputs.version == '' && 'type=gha,mode=max,scope=console' || '' }}

  trivy:
    name: Trivy
    # After the push, never before: a critical vulnerability turns the run red
    # but does not hold back the image and the fixes it carries. A version is
    # scanned by version.yml, once published.
    needs: [docker]
    if: inputs.version == ''
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/failles.yml
    with:
      images: ghcr.io/${{ github.repository_owner }}/button-console:${{ github.sha }}
