name: console

# Type-check, tests and build first; the image is pushed only from main.

on:
  push:
    branches: [main]
    paths:
      - "console/**"
      - "!console/**/*.md"
      - ".github/workflows/console.yml"
  pull_request:
    paths:
      - "console/**"
      - "!console/**/*.md"
      - ".github/workflows/console.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  check:
    name: tsc, tests, vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    name: build & push image
    needs: [check]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Dated tag
        id: tag
        run: echo "dated=$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./console
          platforms: linux/amd64
          # The serve stage upgrades Alpine's packages: from the cache, it
          # would keep those of its first build. The npm build stays cached.
          no-cache-filters: serve
          push: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/button-console:main
            ghcr.io/${{ github.repository_owner }}/button-console:${{ steps.tag.outputs.dated }}
            ghcr.io/${{ github.repository_owner }}/button-console:${{ github.sha }}
          cache-from: type=gha,scope=console
          cache-to: type=gha,mode=max,scope=console
