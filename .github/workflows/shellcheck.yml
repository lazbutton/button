name: shellcheck

# ShellCheck on the repository's own shell scripts, at a pinned version: a new
# release, with new checks, must not turn an unrelated pull request red.
# Dependabot does not follow the image: bump it by hand. The list of scripts is
# in the step below, and nowhere else. Any change to a .sh file runs the job; a
# script without the extension also needs its own path in the triggers.
# engine/dev.sh and engine/install.sh come from upstream Radiotomate: they stay
# out of the list.

on:
  push:
    branches: [main]
    paths:
      - "**.sh"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    paths:
      - "**.sh"
      - ".github/workflows/shellcheck.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The scripts of the repository
        # scripts/verifier.sh (deploy) runs the same image on the same list,
        # both read from here: the image alone on its line, then one script or
        # pattern per line. The runner's shell expands the patterns.
        run: >
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt
          docker.io/koalaman/shellcheck:v0.11.0
          scripts/*.sh
          deploy/scripts/*.sh
          deploy/share/entrypoint.sh
          console/docker/docker-entrypoint.sh
          services/icecast/docker-entrypoint.sh
