name: engine

# Tests first, images only when green. A station may follow `:main`, so a red
# test suite must never reach the registry. A version tag, vX.Y.Z, runs this
# workflow through version.yml, which publishes the version.

on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "!engine/**/*.md"
      - ".github/workflows/engine.yml"
  pull_request:
    paths:
      - "engine/**"
      - "!engine/**/*.md"
      - ".github/workflows/engine.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: The version to publish, X.Y.Z. Only version.yml calls this workflow.
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  tests:
    name: pytest (scheduler, models, migrations)
    runs-on: ubuntu-latest
    # Same zone as the prod containers (compose TZ): the scheduler keeps
    # Paris-naive timestamps and a few tests build them with datetime.now().
    env:
      TZ: Europe/Paris
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Same interpreter as the Containerfile (python:3.13-slim-bookworm)
          python-version: "3.13"
      - name: Install poetry
        run: pipx install poetry
      - name: Install dependencies
        # With the root package: `radiotomate` CLI and version are under test.
        run: poetry install --no-interaction
      - name: Ruff
        run: |
          poetry run ruff check radiotomate tests
          poetry run ruff format --check radiotomate tests
      - name: Pytest
        run: >
          poetry run pytest -q -p no:cacheprovider -o addopts=""
          tests --ignore=tests/e2e --ignore=tests/interface

  liquidsoap-check:
    name: liquidsoap --check radiotomate.liq
    runs-on: ubuntu-latest
    container:
      image: docker.io/savonet/liquidsoap:v2.4.5
      options: --user root
    steps:
      - uses: actions/checkout@v7
      - name: Minimal RTCONFIG for the type-checker
        run: |
          cat > /tmp/rtconfig.yaml <<'YAML'
          playout_process_config:
            input_name: "stream"
            input_min_buffer: 5.
            input_max_buffer: 30.
            token: "ci"
            start_sound: "/tmp/start.wav"
          metadata_log:
            extra_fields: []
          YAML
      - name: Type-check the script
        env:
          RTCONFIG: /tmp/rtconfig.yaml
        run: liquidsoap --check engine/playout/radiotomate.liq

  # The type-checker reads the script, this plays it: titles pushed as the
  # scheduler pushes them, in the Liquidsoap of the playout image, and the
  # sound that comes out. A music queue that stalls airs a buzz, with nothing
  # in the logs. A relay and a live then cut a title: the heartbeat must name
  # each, as the scheduler and the console read it.
  antenna:
    name: the playout plays what it is given
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Play the script and listen
        run: python3 engine/playout/tests/antenna.py

  # pytest plays the scheduler before a simulated heartbeat, and the antenna
  # bench plays the playout before a fake scheduler: a fault between the two
  # shows in neither. This one brings up the scheduler and the interface of the
  # branch before the Liquidsoap of the playout image, in its network as on a
  # station, and compares the times the conducteur gives to what airs, around
  # two cuts on the minute, a relay and a live. The image of the engine is
  # built here, on the layers the last build of main left in the cache.
  rundown:
    name: the scheduler holds the antenna on time
    runs-on: ubuntu-latest
    # Six minutes of antenna: a stack that hangs must not hold the runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the engine image
        uses: docker/build-push-action@v7
        with:
          context: ./engine
          file: ./engine/Containerfile
          load: true
          tags: button-radiotomate:rundown
          cache-from: type=gha,scope=radiotomate
      - name: Hold the antenna and compare the conducteur to it
        env:
          RUNDOWN_ENGINE_IMAGE: button-radiotomate:rundown
        run: python3 engine/playout/tests/rundown.py --journal rundown.json
      # What the probe noted: `rundown.py --relire rundown.json` judges it again.
      - name: Upload the journal of the probe
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: conducteur-${{ github.run_attempt }}
          path: rundown.json
          retention-days: 14

  docker:
    name: build & push images
    needs: [tests, liquidsoap-check, antenna, rundown]
    # From main, or for a version, through version.yml. "Run workflow" has no
    # version input: it never builds one.
    if: >-
      inputs.version != ''
      || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tags
        id: tags
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # From main: main, a dated tag and the full SHA. For a version: X.Y.Z
        # only; version.yml adds X.Y and stable once the seven images are in.
        # A published version is never rebuilt: "Re-run all jobs" skips the
        # build, and version.yml finishes the publication. The run of a tag
        # moved since builds nothing.
        run: |
          if [ -n "$VERSION" ]; then
            tagged=$(git ls-remote origin "refs/tags/v$VERSION" "refs/tags/v$VERSION^{}" | tail -n 1 | cut -f1)
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error title=Version $VERSION::v$VERSION ne pointe plus sur le commit de ce run : seul le run du tag actuel publie."
              exit 1
            fi
            if [ "$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
              echo "::notice title=Version $VERSION::Déjà publiée : rien à reconstruire."
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            tags=("$VERSION")
          else
            VERSION=$(date -u +%Y%m%d)-${GITHUB_SHA::7}
            tags=(main "$VERSION" "$GITHUB_SHA")
          fi
          {
            echo "version=$VERSION"
            for image in radiotomate playout; do
              echo "$image<<EOF"
              for tag in "${tags[@]}"; do echo "$REGISTRY/button-$image:$tag"; done
              echo "EOF"
            done
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        if: steps.tags.outputs.published != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
        if: steps.tags.outputs.published != 'true'
      - name: Build and push webapps
        if: steps.tags.outputs.published != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./engine
          file: ./engine/Containerfile
          platforms: linux/amd64
          push: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.radiotomate }}
          cache-from: type=gha,scope=radiotomate
          # A version reads the cache of main and writes none: a cache written
          # under a tag serves no other run, and pushes out those of main.
          cache-to: ${{ inputs.version == '' && 'type=gha,mode=max,scope=radiotomate' || '' }}
      - name: Build and push playout
        if: steps.tags.outputs.published != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./engine/playout
          file: ./engine/playout/Containerfile
          platforms: linux/amd64
          push: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.playout }}
          cache-from: type=gha,scope=playout
          cache-to: ${{ inputs.version == '' && 'type=gha,mode=max,scope=playout' || '' }}

  trivy:
    name: Trivy
    # After the push, never before: a critical vulnerability turns the run red
    # but does not hold back the images and the fixes they carry. A version is
    # scanned by version.yml, once published.
    needs: [docker]
    if: inputs.version == ''
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/failles.yml
    with:
      images: >-
        ghcr.io/${{ github.repository_owner }}/button-radiotomate:${{ github.sha }}
        ghcr.io/${{ github.repository_owner }}/button-playout:${{ github.sha }}
