version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /console
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      console:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /services/catalog
    schedule:
      interval: monthly
  # The engine (Poetry) is left out on purpose: its pins follow upstream
  # Radiotomate and Liquidsoap, and are updated by hand.
