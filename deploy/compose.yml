name: button

# The whole station: engine (playout + interface + scheduler), console,
# Icecast, now playing, media catalogue and resumable uploads.
# Variables: deploy/.env (copy of .env.example). See docs/deploiement.md.
#
# Docker rotates stdout/stderr; the interface and scheduler rotate their own
# log files. playout.log needs a logrotate rule on the host.
#
# BUTTON_VERSION choisit la version des sept images de BUTTON, stable par
# défaut : voir .env.example et docs/deploiement.md, « Mettre à jour ».
#
# Console, Icecast, nowplaying et catalogue publient leur port sur BIND_ADDRESS :
# 127.0.0.1 sur un VPS, où seul le reverse proxy les joint. Vide, le port n'a
# pas d'adresse et écoute sur toutes les interfaces, en IPv4 et en IPv6 :
# 0.0.0.0 n'écouterait qu'en IPv4.

# RT_TAG, l'ancienne variable, n'épinglait que le moteur. Posé, il arrête
# docker compose, qui dit quoi faire : ignoré, il laisserait le moteur repartir
# sur une autre version, et migrer le schéma. Ce champ vaut false, ou, RT_TAG
# posé, une phrase. Le tty de radiotomate-init le reprend : Compose n'y lit pas
# de booléen, et s'arrête en citant la phrase. Jamais ${RT_TAG:+${…:?…}} :
# Compose v2 évalue le :? même sans RT_TAG, et s'arrêterait toujours.
x-rt-tag: &rt-tag "${RT_TAG:+RT_TAG=}${RT_TAG:-false}${RT_TAG:+ n'est plus lu. Le retirer de .env, et épingler la version par BUTTON_VERSION. Voir docs/deploiement.md, « Mettre à jour ».}"

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-radiotomate-data: &radiotomate-data
  - ${RT_DATA:-./data/radiotomate}:/data
  - ${BUTTON_MEDIA:-./media}:/media

x-radiotomate-webapps: &radiotomate-webapps
  image: ${BUTTON_IMAGES:-ghcr.io/lazbutton}/button-radiotomate:${BUTTON_VERSION:-stable}
  platform: linux/amd64
  build:
    context: ../engine
    dockerfile: Containerfile
  restart: unless-stopped
  logging: *logging
  environment:
    RTCONFIG: /data/radiotomate.yaml
    BEETSDIR: /data/Beets
    MEDIA_ROOT: /media
    # Scheduler stores Paris-naive times (planned_at); keep created/reserved
    # (datetime.now()) in the same zone instead of the image's UTC.
    TZ: ${TZ:-Europe/Paris}
  volumes: *radiotomate-data

services:
  console:
    image: ${BUTTON_IMAGES:-ghcr.io/lazbutton}/button-console:${BUTTON_VERSION:-stable}
    platform: linux/amd64
    build:
      context: ../console
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BUTTON_BACKEND: ${BUTTON_BACKEND:-http://radiotomate-playout:6811}
      TUSD_UPSTREAM: http://tusd:8080
      # CSP : le flux et now.json, quand ils sont sur une autre origine.
      CSP_MEDIA_SRC: ${CSP_MEDIA_SRC:-}
      CSP_CONNECT_SRC: ${CSP_CONNECT_SRC:-}
      # Les reverse proxies que nginx croit pour l'adresse du client. Vide : la
      # boucle locale et les réseaux privés, où est Caddy.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    ports:
      - "${BIND_ADDRESS:-}${BIND_ADDRESS:+:}${CONSOLE_PORT:-30126}:80"
    depends_on:
      - radiotomate-playout
      - tusd

  icecast:
    image: ${BUTTON_IMAGES:-ghcr.io/lazbutton}/button-icecast:${BUTTON_VERSION:-stable}
    platform: linux/amd64
    build:
      context: ../services/icecast
    restart: unless-stopped
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:?ICECAST_SOURCE_PASSWORD manquant dans .env}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD:?ICECAST_ADMIN_PASSWORD manquant dans .env}
      ICECAST_ADMIN_EMAIL: ${ICECAST_ADMIN_EMAIL:-admin@localhost}
      # Le mount WAV du casque, comme radiotomate-init : Icecast lui donne une
      # file plus longue.
      ICECAST_MONITOR_MOUNT: ${ICECAST_MONITOR_MOUNT:-studio.wav}
    ports:
      - "${BIND_ADDRESS:-}${BIND_ADDRESS:+:}${ICECAST_PORT:-18000}:8000"
    # Avec les secrets de .env.example, Icecast ne démarre pas non plus : sinon,
    # n'importe qui diffuserait sur le mount laissé libre par le playout.
    depends_on:
      radiotomate-init:
        condition: service_completed_successfully

  nowplaying:
    image: ${BUTTON_IMAGES:-ghcr.io/lazbutton}/button-nowplaying:${BUTTON_VERSION:-stable}
    platform: linux/amd64
    build:
      context: ../services/nowplaying
    restart: unless-stopped
    environment:
      RT_NOWPLAYING_PORT: "6820"
      RT_NOWPLAYING_SECRET: ${RT_NOWPLAYING_SECRET:?RT_NOWPLAYING_SECRET manquant dans .env}
      RT_NOWPLAYING_FILE: /data/now.json
      # La sonde /machine.json : GET /health du playout, sans jeton. nowplaying
      # n'a pas d'autre route vers le playout, ni vers son antenne.
      RT_PLAYOUT_URL: http://radiotomate-playout:6833
      BUTTON_MEDIA_ROOT: /media
    volumes:
      - ${NOWPLAYING_DATA:-./data/nowplaying}:/data
      # Lecture seule, pour /machine.json : radiotomate.yaml pour les tampons du
      # harbor, la banque pour la place sur le disque.
      - ${RT_DATA:-./data/radiotomate}/radiotomate.yaml:/config/radiotomate.yaml:ro
      - ${BUTTON_MEDIA:-./media}:/media:ro
    ports:
      - "${BIND_ADDRESS:-}${BIND_ADDRESS:+:}${NOWPLAYING_PORT:-6820}:6820"
    # Comme Icecast : pas de /hook ouvert avec un secret d'exemple.
    depends_on:
      radiotomate-init:
        condition: service_completed_successfully

  radiotomate-init:
    image: ${BUTTON_IMAGES:-ghcr.io/lazbutton}/button-radiotomate:${BUTTON_VERSION:-stable}
    platform: linux/amd64
    build:
      context: ../engine
      dockerfile: Containerfile
    user: "0:0"
    restart: "no"
    # Le garde de RT_TAG : false, sauf RT_TAG posé. Voir x-rt-tag.
    tty: *rt-tag
    environment:
      RADIOTOMATE_DATA: /data
      BEETSDIR: /data/Beets
      MEDIA_ROOT: /media
      # Les cinq secrets : le script refuse ceux de .env.example avant tout.
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:?ICECAST_SOURCE_PASSWORD manquant dans .env}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD:?ICECAST_ADMIN_PASSWORD manquant dans .env}
      RT_NOWPLAYING_SECRET: ${RT_NOWPLAYING_SECRET:?RT_NOWPLAYING_SECRET manquant dans .env}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY manquant dans .env}
      RT_ADMIN_USER: ${RT_ADMIN_USER:-button}
      RT_ADMIN_PASSWORD: ${RT_ADMIN_PASSWORD:-}
      # false seulement pour un accès en HTTP seul : voir docs/deploiement.md.
      RT_COOKIE_SECURE: ${RT_COOKIE_SECURE:-true}
      # 1 en secours seulement : un secret trop court avertit sans bloquer.
      RT_ALLOW_SHORT_SECRETS: ${RT_ALLOW_SHORT_SECRETS:-}
      # Les mounts d'Icecast : le flux public et le casque WAV de la console.
      ICECAST_MOUNT: ${ICECAST_MOUNT:-radio.mp3}
      ICECAST_MONITOR_MOUNT: ${ICECAST_MONITOR_MOUNT:-studio.wav}
      # Les alertes sur un téléphone et par e-mail, que station config règle :
      # le script les écrit dans radiotomate.yaml, que le scheduler relit seul.
      DOMAIN: ${DOMAIN:-}
      BUTTON_ALERT_NTFY: ${BUTTON_ALERT_NTFY:-}
      BUTTON_ALERT_NTFY_TOKEN: ${BUTTON_ALERT_NTFY_TOKEN:-}
      BUTTON_ALERT_EMAIL: ${BUTTON_ALERT_EMAIL:-}
      BUTTON_ALERT_FROM: ${BUTTON_ALERT_FROM:-}
      BUTTON_ALERT_SMTP: ${BUTTON_ALERT_SMTP:-}
      BUTTON_ALERT_SMTP_USER: ${BUTTON_ALERT_SMTP_USER:-}
      BUTTON_ALERT_SMTP_PASSWORD: ${BUTTON_ALERT_SMTP_PASSWORD:-}
    volumes:
      - ${RT_DATA:-./data/radiotomate}:/data
      - ${BUTTON_MEDIA:-./media}:/media
      - ./scripts/init-radiotomate.sh:/init-radiotomate.sh:ro
      - ./scripts/setup-media-tree.sh:/setup-media-tree.sh:ro
    entrypoint: ["/bin/sh", "/init-radiotomate.sh"]

  radiotomate-playout:
    image: ${BUTTON_IMAGES:-ghcr.io/lazbutton}/button-playout:${BUTTON_VERSION:-stable}
    platform: linux/amd64
    build:
      context: ../engine/playout
      dockerfile: Containerfile
    restart: unless-stopped
    logging: *logging
    environment:
      RTCONFIG: /data/radiotomate.yaml
      TZ: ${TZ:-Europe/Paris}
    volumes: *radiotomate-data
    # Le harbor, l'entrée du direct : un port ouvert au public, comme 80 et 443,
    # donc sans BIND_ADDRESS. Sur Internet, il ne doit accepter que les jetons
    # d'encodeur : features.allow_account_password à faux, voir
    # docs/deploiement.md.
    ports:
      - "${HARBOR_PORT:-6800}:6800"
    # No curl in the Liquidsoap image: bash /dev/tcp against the harbor API.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/6833 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && head -c 15 <&3 | grep -q " 200 "'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      radiotomate-init:
        condition: service_completed_successfully
      icecast:
        condition: service_started

  radiotomate-interface:
    <<: *radiotomate-webapps
    network_mode: service:radiotomate-playout
    command: ["radiotomate", "interface"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:6811/health/ready', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 40s
    depends_on:
      radiotomate-playout:
        condition: service_healthy

  radiotomate-scheduler:
    <<: *radiotomate-webapps
    network_mode: service:radiotomate-playout
    command: ["radiotomate", "scheduler"]
    # /health/ready = DB + heartbeat Liquidsoap < 5 s + playout joignable.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:6822/health/ready', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 60s
    depends_on:
      radiotomate-playout:
        condition: service_healthy

  radiotomate-dropbox:
    <<: *radiotomate-webapps
    volumes:
      - ${RT_DATA:-./data/radiotomate}:/data
      - ${BUTTON_MEDIA:-./media}:/media
      - share-private:/share-private
      - ./scripts/beets-import-loop.sh:/beets-import-loop.sh:ro
      # La boucle Beets appelle ce script à chaque tour. À la main :
      # docker exec button-radiotomate-dropbox-1 sh /promote-inbox.sh
      - ./scripts/promote-inbox.sh:/promote-inbox.sh:ro
      - ./scripts/refresh_volume.py:/refresh_volume.py:ro
      - ./scripts/export_share_roles.py:/export_share_roles.py:ro
    command: ["/bin/sh", "/beets-import-loop.sh"]
    depends_on:
      radiotomate-init:
        condition: service_completed_successfully

  meilisearch:
    image: getmeili/meilisearch:v1.11
    platform: linux/amd64
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY manquant dans .env}
      MEILI_ENV: production
    volumes:
      - ${MEILI_DATA:-./data/meilisearch}:/meili_data

  catalog:
    image: ${BUTTON_IMAGES:-ghcr.io/lazbutton}/button-catalog:${BUTTON_VERSION:-stable}
    platform: linux/amd64
    build:
      # Repository root: the image also ships deploy/scripts/setup-media-tree.sh.
      context: ..
      dockerfile: services/catalog/Dockerfile
    restart: unless-stopped
    user: "0:0"
    environment:
      MEDIA_ROOT: /media
      AUTOMATE_URL: http://radiotomate-playout:6811
      TUSD_DIR: /tusd
      # Le volume tusd-data naît à root. Au démarrage, le catalogue le donne à
      # tusd, qui ne tourne pas en root : sinon, chaque envoi échoue en 500,
      # « open /tusd/… : permission denied ».
      TUSD_USER: "1000:1000"
      INBOX_QUOTA_BYTES: ${INBOX_QUOTA_BYTES:-107374182400}
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY manquant dans .env}
      CATALOG_PORT: "30127"
      STATION_NAME: ${STATION_NAME:-BUTTON}
      SMB_HOST: ${SMB_HOST:-}
      # Le volume share-private naît à root. Au démarrage, le catalogue l'ouvre
      # en 1777, comme /tmp : la boucle Beets du moteur, qui ne tourne pas en
      # root, y écrit les rôles du dossier partagé.
      SHARE_PRIVATE: /share-private
    volumes:
      - ${BUTTON_MEDIA:-./media}:/media
      - tusd-data:/tusd
      - share-private:/share-private
      # Read-only: the engine's token for the Agenda deposit routes.
      - ${RT_DATA:-./data/radiotomate}/radiotomate.yaml:/config/radiotomate.yaml:ro
    ports:
      - "${BIND_ADDRESS:-}${BIND_ADDRESS:+:}${CATALOG_PORT:-30127}:30127"
    # radiotomate-init écrit radiotomate.yaml. Un service qui monte ce fichier
    # démarre après lui : sinon, Docker crée à sa place un dossier vide, et le
    # premier `docker compose up` échoue. Le contrôle des secrets, dont
    # MEILI_MASTER_KEY, passe ainsi avant le catalogue.
    depends_on:
      meilisearch:
        condition: service_started
      radiotomate-init:
        condition: service_completed_successfully

  tusd:
    image: tusproject/tusd:v2.8.0
    restart: unless-stopped
    # L'utilisateur de l'image, pas root : le TUSD_USER du catalogue.
    user: "1000:1000"
    command:
      - "-host=0.0.0.0"
      - "-port=8080"
      - "-behind-proxy"
      - "-base-path=/tus/"
      - "-upload-dir=/tusd"
      - "-hooks-http=http://catalog:30127/tus-hook"
      - "-hooks-http-forward-headers=Cookie,X-Invite-Token"
      - "-hooks-enabled-events=pre-create,post-finish"
    volumes:
      - tusd-data:/tusd
    depends_on:
      - catalog

  # Dossier Finder. Absent de `docker compose up` : `--profile share`.
  # SMB_BIND est l'adresse Tailscale. 0.0.0.0 est refusé au démarrage.
  share:
    profiles: ["share"]
    image: ${BUTTON_IMAGES:-ghcr.io/lazbutton}/button-share:${BUTTON_VERSION:-stable}
    platform: linux/amd64
    build:
      context: ..
      dockerfile: deploy/share/Dockerfile
    restart: unless-stopped
    environment:
      STATION_NAME: ${STATION_NAME:-BUTTON}
      SMB_BIND: ${SMB_BIND:-}
      SMB_ALLOW_PUBLIC: ${SMB_ALLOW_PUBLIC:-}
      MEDIA_ROOT: /media
      SHARE_PRIVATE: /share-private
    volumes:
      - ${BUTTON_MEDIA:-./media}:/media
      - share-private:/share-private
    ports:
      - "${SMB_BIND:-127.0.0.1}:445:445"

  # Bacs ouverts dans Dropbox. Absent de `docker compose up` : `--profile cloud`.
  # Copie dans son bac un son déposé dans Bacs/<id>-<titre>, dans le dossier
  # Dropbox de la station. Voir docs/exploitation/bacs-dropbox.md.
  cloud-sync:
    profiles: ["cloud"]
    image: rclone/rclone:1.75.2
    restart: unless-stopped
    logging: *logging
    environment:
      CLOUD_SYNC_REMOTE: ${CLOUD_SYNC_REMOTE:-}
      CLOUD_SYNC_INTERVAL: ${CLOUD_SYNC_INTERVAL:-60}
      MEDIA_ROOT: /media
      # L'heure du compte rendu, dans Dropbox.
      TZ: ${TZ:-Europe/Paris}
    volumes:
      # Au même chemin que pour le moteur : les liens de Carts/ visent /media.
      - ${BUTTON_MEDIA:-./media}:/media
      # Ce qui a déjà été copié : un son retiré dans la console ne revient pas.
      - cloud-sync-state:/state
      # rclone.conf, avec le jeton Dropbox, hors du dépôt et de .env. En
      # écriture : rclone y renouvelle le jeton.
      - ${CLOUD_SYNC_CONFIG:-./data/rclone}:/config/rclone
      - ./scripts/cloud-sync.sh:/cloud-sync.sh:ro
    entrypoint: ["/bin/sh", "/cloud-sync.sh"]

  # HTTPS sur Internet. Absent de `docker compose up` : `--profile vps`, ou
  # COMPOSE_PROFILES=vps dans .env. Caddy joint les services par le réseau de
  # Docker : BIND_ADDRESS=127.0.0.1 ferme leurs ports sans le gêner.
  # Voir deploy/Caddyfile et docs/deploiement.md, « HTTPS ».
  caddy:
    profiles: ["vps"]
    image: caddy:2.11-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      DOMAIN: ${DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      # acme : Let's Encrypt. internal : un certificat de Caddy, pour un essai.
      CADDY_TLS: ${CADDY_TLS:-acme}
    # Sans domaine, Caddy ne démarre pas, et dit quoi régler.
    command:
      - sh
      - -c
      - |
        if [ -z "$$DOMAIN" ]; then
          echo "DOMAIN manquant dans .env : le domaine de la station, qui pointe sur cette machine." >&2
          exit 1
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Les certificats et le compte Let's Encrypt : à garder d'une version à
      # l'autre, sinon Caddy redemande un certificat à chaque démarrage, et
      # Let's Encrypt en limite le nombre.
      - ${CADDY_DATA:-./data/caddy}:/data/caddy
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3.
      - "443:443/udp"

volumes:
  tusd-data:
  share-private:
  cloud-sync-state:
